<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高中同学全国蹭饭图</title>
  <script src="https://cdn.staticfile.org/vue/3.4.21/vue.global.min.js"></script>
  <script src="https://cdn.staticfile.org/echarts/5.5.0/echarts.min.js"></script>
  <script>
    // ========== 兜底1：CDN 加载失败检测（10 秒未加载 Vue 则显示报错指引）==========
    window.__cdnCheckTimer = setTimeout(function () {
      if (typeof Vue === 'undefined') {
        var app = document.getElementById('app');
        if (app) {
          app.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;">' +
            '<div style="max-width:560px;padding:32px 28px;background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,0.1);border-top:4px solid #C0392B;">' +
            '<h2 style="color:#C0392B;margin-bottom:16px;font-size:20px;">⚠️ 前端资源加载失败 (Vue CDN)</h2>' +
            '<p style="line-height:1.9;color:#333;margin-bottom:10px;">主要原因：网络无法访问前端 CDN（国内网络环境常见问题）。</p>' +
            '<div style="background:#FDF2E9;padding:14px 18px;border-radius:8px;margin-bottom:16px;">' +
            '<p style="color:#8B4513;font-weight:600;margin-bottom:8px;">解决方法（按顺序试）：</p>' +
            '<ol style="padding-left:22px;color:#8B4513;line-height:2;">' +
            '<li>按 <b>Ctrl + F5</b> 或 <b>Cmd + Shift + R</b> 强制刷新浏览器</li>' +
            '<li>切换网络：关闭 Wi-Fi 用手机热点，或者换一个 Wi-Fi</li>' +
            '<li>关闭 VPN/代理软件后重试</li>' +
            '<li>如果是校园网/公司内网，可能屏蔽了静态资源 CDN，请联系管理员</li>' +
            '</ol>' +
            '</div>' +
            '<p style="color:#888;font-size:13px;">详细错误可按 F12 打开开发者工具 → Console 面板查看红色报错</p>' +
            '</div></div>';
        }
      }
    }, 10000);

    // ========== 兜底2：全局致命错误显示（避免任何白屏看不到报错）==========
    window.__showFatalError = function (title, detail) {
      try {
        clearTimeout(window.__cdnCheckTimer);
        var detailStr = '';
        try { detailStr = (detail && detail.stack) ? detail.stack : String(detail || ''); } catch (e) { detailStr = String(detail); }
        var box = document.getElementById('__fatal_error_box__');
        if (!box) {
          box = document.createElement('div');
          box.id = '__fatal_error_box__';
          box.style.cssText = 'position:fixed;z-index:99999999;top:0;left:0;right:0;max-height:80vh;overflow:auto;background:#fff8e1;border-bottom:5px solid #C0392B;padding:20px 24px;font-family:Consolas,\'Courier New\',monospace;font-size:13px;line-height:1.7;color:#222;box-shadow:0 10px 40px rgba(0,0,0,0.2);';
          document.body.insertBefore(box, document.body.firstChild);
        }
        box.innerHTML =
          '<div style="font-size:18px;font-weight:700;color:#C0392B;margin-bottom:10px;">❌ ' + title + '</div>' +
          '<div style="color:#7a1a0a;white-space:pre-wrap;word-break:break-all;">' +
          '<div style="margin-bottom:8px;padding:6px 10px;background:#fff;border:1px solid #C0392B;border-radius:6px;">报错详情：' + detailStr.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>' +
          '<div style="color:#555;margin-top:12px;">请把上面红色框里的报错内容（全部）截图发给开发者排错即可。<br>临时处理：按 <b>Ctrl + F5</b> 强制刷新，或切换网络重试。</div>' +
          '</div>';
      } catch (e) { console.error('ShowFatalError 自身也出错了:', e); }
    };

    // 捕获：JS 语法错误 / 运行时错误
    window.addEventListener('error', function (e) {
      var msg = (e.error && e.error.message) ? e.error.message : e.message;
      var info = msg + ' ( ' + (e.filename || '?') + ':' + (e.lineno || '?') + ':' + (e.colno || '?') + ')';
      window.__showFatalError('JS 运行错误', info + '\n' + ((e.error && e.error.stack) || ''));
    }, true);

    // 捕获：未处理的 Promise reject（API 抛错没写 .catch）
    // 注意：仅真正的致命错误（非网络/HTTP 异常）才显示红框，避免 API 偶尔失败就"白屏"
    window.addEventListener('unhandledrejection', function (e) {
      var reason = e.reason;
      var msg = (reason && reason.message) ? reason.message : String(reason || '');
      // 普通网络/HTTP 错误不显示致命红框，只打控制台，防止单接口失败就整页"白屏"
      if (/HTTP\s+\d+|NetworkError|Failed to fetch|网络错误|timeout/i.test(msg)) {
        console.warn('[unhandledrejection] 已忽略的网络错误:', msg);
        return;
      }
      var detail = (reason && reason.stack) ? reason.stack : (reason ? reason.message || String(reason) : String(e));
      window.__showFatalError('未捕获的 Promise 异步错误 (unhandledrejection)', detail);
    });

    // 正常挂载后清除检测
    window.addEventListener('load', function () {
      if (typeof Vue !== 'undefined' && window.__cdnCheckTimer) {
        clearTimeout(window.__cdnCheckTimer);
      }
      // echarts 加载检测
      if (typeof echarts === 'undefined') {
        console.warn('ECharts CDN 未加载，地图功能将不可用，但其他功能正常');
      }
    });
  </script>
  <style>
    @import url('https://fonts.loli.net/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cinnabar: #C0392B;
      --cinnabar-dark: #922B21;
      --ink: #2C2C2C;
      --ink-light: #555;
      --paper: #FDF8F0;
      --paper-warm: #F5E6D3;
      --paper-deep: #E8D5B7;
      --paper-dark: #D4C4A8;
      --jade: #27AE60;
      --gold: #B8860B;
      --text-muted: #888;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.12);
      --radius-sm: 6px;
      --radius-md: 12px;
    }

    body {
      font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      background-image:
        url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23D4C4A8' fill-opacity='0.15' fill-rule='evenodd'/%3E%3C/svg%3E");
    }

    .calligraphy { font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', cursive; }
    .xiaowei { font-family: 'ZCOOL XiaoWei', 'STSong', serif; }
    .serif { font-family: 'Noto Serif SC', 'STSong', serif; }

    #app { min-height: 100vh; }

    /* 页面过渡 */
    .page-enter-active, .page-leave-active {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: absolute;
      width: 100%;
    }
    .page-enter-from { opacity: 0; transform: translateY(20px); }
    .page-leave-to { opacity: 0; transform: translateY(-20px); }

    /* 弹窗过渡 */
    .modal-enter-active, .modal-leave-active { transition: all 0.3s ease; }
    .modal-enter-from, .modal-leave-to { opacity: 0; }
    .modal-enter-from .modal-content,
    .modal-leave-to .modal-content {
      transform: scale(0.92) translateY(20px);
      opacity: 0;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeInUp 0.5s ease backwards; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--paper-dark);
      border-top-color: var(--cinnabar);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease; }

    /* 按钮 */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.25s ease;
      border: none; font-family: inherit;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--cinnabar) 0%, var(--cinnabar-dark) 100%);
      color: #fff;
      box-shadow: 0 3px 10px rgba(192, 57, 43, 0.3);
    }
    .btn-primary:hover { box-shadow: 0 5px 15px rgba(192, 57, 43, 0.4); }
    .btn-secondary {
      background: #fff; color: var(--ink);
      border: 2px solid var(--paper-dark);
    }
    .btn-secondary:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
    .btn-jade {
      background: linear-gradient(135deg, var(--jade) 0%, #1E8449 100%);
      color: #fff;
    }
    .btn-danger {
      background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
      color: #fff;
    }
    .btn-sm { padding: 5px 12px; font-size: 12px; }

    /* ========== 入口选择页面 ========== */
    .entry-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FDF2E9 0%, #F5E6D3 50%, #FAE5D3 100%);
      position: relative;
      overflow: hidden;
    }
    .entry-page::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background-image: radial-gradient(circle, rgba(192, 57, 43, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      animation: floatBg 20s linear infinite;
    }
    @keyframes floatBg {
      from { transform: translate(0, 0); }
      to { transform: translate(30px, 30px); }
    }
    .entry-content {
      text-align: center;
      padding: 60px 40px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(139, 69, 19, 0.15);
      border: 2px solid var(--paper-dark);
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
      animation: fadeInUp 0.8s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .entry-logo {
      font-size: 80px;
      margin-bottom: 20px;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .entry-title {
      font-size: 42px;
      color: var(--cinnabar);
      margin-bottom: 10px;
      letter-spacing: 4px;
    }
    .entry-subtitle {
      font-size: 18px;
      color: #8B4513;
      margin-bottom: 40px;
      opacity: 0.8;
    }
    .entry-buttons {
      display: flex;
      gap: 30px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .entry-btn {
      width: 200px;
      padding: 30px 20px;
      border: 2px solid var(--paper-dark);
      border-radius: 16px;
      background: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .entry-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(139, 69, 19, 0.2);
    }
    .entry-btn-user:hover {
      border-color: var(--cinnabar);
      background: #FDF2E9;
    }
    .entry-btn-admin:hover {
      border-color: #8B4513;
      background: #F5E6D3;
    }
    .entry-icon {
      font-size: 48px;
    }
    .entry-btn-title {
      font-size: 20px;
      font-weight: 600;
      color: #2C2C2C;
      font-family: "'Noto Serif SC', serif";
    }
    .entry-btn-desc {
      font-size: 13px;
      color: #999;
    }
    .entry-footer {
      font-size: 14px;
      color: #B7950B;
      letter-spacing: 6px;
      opacity: 0.7;
    }

    /* ========== 主页面布局 ========== */
    .main-page {
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* 顶部标题栏 */
    .top-bar {
      background: linear-gradient(180deg, rgba(245,230,211,0.9) 0%, rgba(245,230,211,0.6) 100%);
      border-bottom: 2px solid var(--paper-dark);
      padding: 18px 30px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(8px);
    }
    .top-title {
      font-size: 30px; font-weight: 700;
      color: var(--cinnabar);
      letter-spacing: 6px;
      text-shadow: 2px 2px 0 rgba(212, 172, 13, 0.2);
    }
    .top-subtitle {
      font-size: 14px; color: var(--text-muted);
      letter-spacing: 2px; margin-top: 4px;
    }
    .top-actions { display: flex; gap: 10px; }

    /* 主体内容 */
    .main-content {
      flex: 1;
      display: flex;
      padding: 20px;
      gap: 20px;
    }

    /* 左侧名单 */
    .left-panel {
      width: 340px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid var(--paper-dark);
      border-radius: var(--radius-md);
      padding: 20px;
      overflow-y: auto;
      max-height: calc(100vh - 120px);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
    }

    .panel-title {
      font-size: 20px; font-weight: 600;
      color: var(--cinnabar);
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--paper-dark);
      display: flex; align-items: center; gap: 8px;
    }

    .province-section {
      margin-bottom: 20px;
    }
    .province-name {
      font-size: 18px; font-weight: 600;
      color: var(--cinnabar);
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .province-name::before {
      content: '◆';
      font-size: 12px;
      color: var(--gold);
    }
    .province-count {
      font-size: 12px; font-weight: normal;
      color: var(--text-muted);
      margin-left: 8px;
    }

    .university-group {
      margin-bottom: 10px;
      padding-left: 16px;
    }
    .university-name {
      font-size: 14px;
      color: var(--ink-light);
      font-weight: 500;
      margin-bottom: 6px;
    }
    .university-count {
      font-size: 11px;
      color: var(--cinnabar);
      margin-left: 6px;
    }

    .students-list {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding-left: 12px;
    }
    .student-name {
      font-size: 13px;
      padding: 2px 8px;
      background: var(--paper-warm);
      border-radius: 4px;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .student-name:hover {
      background: var(--cinnabar);
      color: #fff;
      border-color: var(--cinnabar);
    }
    /* 头衔色号：姓名框背景填充色 */
    .student-name.title-gold {
      background: linear-gradient(135deg, #FFF3B0 0%, #FFD700 50%, #FFB300 100%);
      color: #5A3A00;
      border-color: #FFA000;
      box-shadow: 0 2px 8px rgba(255, 160, 0, 0.25);
      font-weight: 600;
    }
    /* 档2：亮银（提亮高光+银白珠光） */
    .student-name.title-silver {
      background: linear-gradient(135deg, #FFFFFF 0%, #F2F5F9 30%, #D9E2EC 60%, #C5D3E3 100%);
      color: #1F2937;
      border-color: #94A3B8;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.95) inset,
        0 -1px 0 rgba(148,163,184,0.3) inset,
        0 3px 10px rgba(148, 163, 184, 0.35);
      font-weight: 600;
    }
    .student-name.title-bronze {
      background: linear-gradient(135deg, #F5DEB3 0%, #CD7F32 50%, #A0522D 100%);
      color: #FFF8EC;
      border-color: #8B4513;
      box-shadow: 0 2px 8px rgba(139, 69, 19, 0.3);
      font-weight: 600;
    }
    /* 档4：赤红字体（姓名框透明底色不变，只改字色，字发光描边） */
    .student-name.title-crimson {
      color: #C0002A;
      text-shadow:
        0 0 2px rgba(255,255,255,0.85),
        0 0 6px rgba(192, 0, 42, 0.55),
        0 0 14px rgba(192, 0, 42, 0.35);
      font-weight: 700;
      letter-spacing: 0.4px;
      background: rgba(255, 245, 247, 0.65);
      border: 1px dashed rgba(192, 0, 42, 0.35);
    }
    .student-name.title-crimson:hover {
      background: #C0002A !important;
      color: #fff !important;
      border-color: #C0002A !important;
      text-shadow: 0 1px 2px rgba(0,0,0,0.25) !important;
    }
    /* 档5：天蓝耀眼（强发光+渐变+动画流光） */
    .student-name.title-sky {
      background: linear-gradient(135deg, #E0F2FE 0%, #7DD3FC 30%, #38BDF8 60%, #0EA5E9 100%);
      color: #082F49;
      border-color: #0284C7;
      font-weight: 700;
      box-shadow:
        0 0 0 1px rgba(14, 165, 233, 0.5),
        0 3px 10px rgba(14, 165, 233, 0.35),
        0 0 16px rgba(56, 189, 248, 0.45),
        0 0 24px rgba(125, 211, 252, 0.25);
      animation: skyGlow 2.6s ease-in-out infinite alternate;
    }
    @keyframes skyGlow {
      from { filter: brightness(1.02) saturate(1); }
      to   { filter: brightness(1.18) saturate(1.15); }
    }
    .student-name.title-sky:hover {
      background: linear-gradient(135deg, #0284C7 0%, #0369A1 100%) !important;
      color: #fff !important;
      border-color: #075985 !important;
      box-shadow: 0 3px 14px rgba(2, 132, 199, 0.55) !important;
    }
    .student-name.title-gold:hover,
    .student-name.title-silver:hover,
    .student-name.title-bronze:hover {
      background: var(--cinnabar);
      color: #fff;
      border-color: var(--cinnabar);
    }
    /* 头衔文字徽章（嵌在姓名框内） */
    .inline-title-badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
    }
    .inline-title-badge.badge-gold { background: #FF8F00; color: #fff; }
    .inline-title-badge.badge-silver { background: linear-gradient(135deg, #F1F5F9, #94A3B8); color: #0F172A; }
    .inline-title-badge.badge-bronze { background: #8B4513; color: #fff; }
    .inline-title-badge.badge-crimson {
      background: #fff; color: #C0002A;
      border: 1px solid #C0002A;
      box-shadow: 0 0 6px rgba(192,0,42,0.35);
    }
    .inline-title-badge.badge-sky {
      background: linear-gradient(135deg, #38BDF8, #0284C7); color: #fff;
      box-shadow: 0 0 8px rgba(56,189,248,0.55);
    }
    .inline-title-badge.badge-normal { background: linear-gradient(135deg, #F5C842, #E67E22); color: #fff; }

    /* 详情页头衔大徽章（4色号） */
    .title-detail-badge {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }
    .title-detail-badge.badge-normal {
      background: linear-gradient(135deg, #F5C842, #E67E22);
      color: #fff;
      box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3);
    }
    .title-detail-badge.badge-gold {
      background: linear-gradient(135deg, #FFF3B0, #FFD700 40%, #FF8F00);
      color: #5A3A00;
      box-shadow: 0 4px 14px rgba(255, 143, 0, 0.4);
      border: 1px solid #FFC107;
    }
    .title-detail-badge.badge-silver {
      background: linear-gradient(135deg, #FAFAFA, #E0E0E0 40%, #9E9E9E);
      color: #263238;
      box-shadow: 0 4px 14px rgba(120, 120, 120, 0.3);
      border: 1px solid #BDBDBD;
    }
    .title-detail-badge.badge-bronze {
      background: linear-gradient(135deg, #F5DEB3, #CD7F32 40%, #8B4513);
      color: #FFF8EC;
      box-shadow: 0 4px 14px rgba(139, 69, 19, 0.4);
      border: 1px solid #A0522D;
    }
    .title-detail-badge.badge-crimson {
      background: #fff;
      color: #C0002A;
      border: 2px solid #C0002A;
      box-shadow: 0 4px 14px rgba(192, 0, 42, 0.3);
      font-weight: 700;
    }
    .title-detail-badge.badge-sky {
      background: linear-gradient(135deg, #E0F2FE, #38BDF8 40%, #0284C7);
      color: #082F49;
      border: 1px solid #0284C7;
      box-shadow:
        0 4px 14px rgba(14, 165, 233, 0.35),
        0 0 16px rgba(56, 189, 248, 0.45);
      font-weight: 700;
      animation: skyGlow 2.6s ease-in-out infinite alternate;
    }
    /* 详情页姓名主标题：档4赤红字体/档5天蓝亮字联动 */
    .detail-student-name {
      font-size: 22px;
      font-weight: 700;
      color: #1F2937;
      margin-right: 8px;
    }
    .detail-student-name.name-crimson {
      color: #C0002A;
      text-shadow:
        0 0 2px rgba(255,255,255,0.9),
        0 0 8px rgba(192, 0, 42, 0.5),
        0 0 16px rgba(192, 0, 42, 0.3);
    }
    .detail-student-name.name-sky {
      background: linear-gradient(135deg, #0369A1, #0284C7 45%, #38BDF8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6));
    }
    /* 留言板三种标签标：实名/社区/匿名 */
    .msg-tag {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 4px;
      line-height: 1.5;
    }
    .msg-tag.realname { background: #ECFDF5; color: #065F46; border: 1px solid #10B981; }
    .msg-tag.community { background: #EFF6FF; color: #1E40AF; border: 1px solid #60A5FA; }
    .msg-tag.anonymous { background: #F3F4F6; color: #4B5563; border: 1px solid #9CA3AF; }
    .msg-tag.community-owner { background: linear-gradient(135deg, #FEF3C7, #F59E0B); color: #78350F; border: 1px solid #D97706; }
    /* 会话未读小红点 */
    .unread-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.7);
      margin-left: 6px;
    }

    /* 中间地图 */
    .map-panel {
      flex: 1;
      position: relative;
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid var(--paper-dark);
      border-radius: var(--radius-md);
      overflow: hidden;
      min-height: 600px;
      box-shadow: var(--shadow-sm);
    }
    .map-container {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 160px);
    }
    .map-loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(253, 248, 240, 0.9);
      z-index: 10;
    }
    .map-empty {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-muted);
      pointer-events: none;
    }
    .map-empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.4; }
    .map-empty-title { font-size: 18px; color: var(--ink-light); margin-bottom: 8px; }

    /* 右侧信息卡 */
    .right-panel {
      width: 300px;
      flex-shrink: 0;
      display: flex; flex-direction: column;
      gap: 20px;
    }
    .info-card {
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid var(--paper-dark);
      border-radius: var(--radius-md);
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
    }
    .info-card-title {
      font-size: 16px; font-weight: 600;
      color: var(--cinnabar);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--paper-dark);
    }
    .stat-item {
      display: flex; justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed var(--paper-dark);
    }
    .stat-item:last-child { border-bottom: none; }
    .stat-label { color: var(--text-muted); font-size: 13px; }
    .stat-value { font-weight: 600; color: var(--cinnabar); font-size: 16px; }

    /* 留言板 */
    .message-card {
      display: flex;
      flex-direction: column;
    }
    .message-count {
      font-size: 12px;
      font-weight: normal;
      color: #999;
      margin-left: 8px;
    }
    /* 公告栏样式（优化版：更醒目） */
    .notice-card {
      border: 2px solid #F5C842;
      background: linear-gradient(180deg, #FFFBF0 0%, #FFF6E0 100%);
      box-shadow: 0 4px 16px rgba(214, 158, 46, 0.15);
    }
    .notice-card .info-card-title {
      font-size: 18px !important;
      letter-spacing: 1px;
    }
    /* 社区卡片 */
    .community-card {
      padding: 12px 14px;
      background: linear-gradient(135deg, #FFFFFF 0%, #F0F9FF 100%);
      border: 1px solid #BFDBFE;
      border-radius: 10px;
      animation: fadeInUp 0.45s ease both;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 2px 8px rgba(30, 64, 175, 0.08);
    }
    .community-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(30, 64, 175, 0.15);
    }
    .announcement-item {
      padding: 14px;
      background: linear-gradient(135deg, #FFF8E1 0%, #FFFAF0 100%);
      border-left: 4px solid #D4A017;
      border-radius: 8px;
      animation: fadeInUp 0.5s ease both;
      margin-bottom: 10px;
      transition: transform 0.2s ease;
    }
    .announcement-item.is-pinned {
      background: linear-gradient(135deg, #FDE68A 0%, #FCD34D 100%);
      border-left: 4px solid #B45309;
      box-shadow: 0 4px 10px rgba(180, 83, 9, 0.15);
    }
    .announcement-item:hover { transform: translateX(2px); }
    .pinned-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      background: #B45309;
      color: #FFF7ED;
      border-radius: 10px;
      margin-right: 6px;
      font-weight: 600;
      font-family: sans-serif;
    }
    .announcement-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .announcement-title {
      font-weight: 600;
      font-size: 15px;
      color: #78350F;
      font-family: "'Ma Shan Zheng', cursive";
    }
    .is-pinned .announcement-title { color: #7C2D12; }
    .announcement-date {
      font-size: 11px;
      color: #92400E;
      flex-shrink: 0;
      background: rgba(255,255,255,0.6);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .announcement-content {
      font-size: 14px;
      color: #451A03;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* 顶部置顶公告横幅 */
    .announcement-banner {
      background: linear-gradient(90deg, #FDE68A 0%, #FBBF24 50%, #F59E0B 100%);
      color: #7C2D12;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.2);
      animation: bannerFlash 3s ease-in-out infinite alternate;
    }
    @keyframes bannerFlash {
      from { filter: brightness(1); }
      to   { filter: brightness(1.05); }
    }
    .announcement-banner .banner-tag {
      background: #7C2D12;
      color: #FDE68A;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      flex-shrink: 0;
      letter-spacing: 1px;
    }
    .announcement-banner .banner-content {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }
    .announcement-banner .banner-time {
      font-size: 11px;
      opacity: 0.8;
      flex-shrink: 0;
    }
    .message-list {
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 12px;
      padding-right: 4px;
    }
    .message-list::-webkit-scrollbar {
      width: 6px;
    }
    .message-list::-webkit-scrollbar-thumb {
      background: var(--paper-dark);
      border-radius: 3px;
    }
    .message-item {
      padding: 10px 0;
      border-bottom: 1px dashed var(--paper-dark);
    }
    .message-item:last-child { border-bottom: none; }
    .message-content {
      font-size: 13px;
      color: #333;
      line-height: 1.6;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .message-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .message-time {
      font-size: 11px;
      color: #999;
    }
    .message-delete {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      opacity: 0.6;
      transition: opacity 0.2s;
      padding: 2px 4px;
    }
    .message-delete:hover { opacity: 1; }
    .message-input-wrap {
      border-top: 1px solid var(--paper-dark);
      padding-top: 12px;
    }
    .message-input {
      width: 100%;
      min-height: 60px;
      border: 1px solid var(--paper-dark);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      background: rgba(255, 255, 255, 0.8);
      box-sizing: border-box;
    }
    .message-input:focus {
      outline: none;
      border-color: var(--cinnabar);
    }
    .message-input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .char-count {
      font-size: 11px;
      color: #999;
    }

    /* ========== 聊天板（实名气泡）样式 ========== */
    .chat-card {
      background: linear-gradient(180deg, #FAFBFF 0%, #F0F4FF 100%);
      border: 1px solid #DBEAFE;
    }
    .chat-list {
      max-height: 300px;
      padding-right: 6px;
    }
    .chat-bubble {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px dashed #E5E7EB;
      animation: fadeInUp 0.4s ease both;
      position: relative;
    }
    .chat-bubble:last-child { border-bottom: none; }
    .chat-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #C0392B, #8B4513);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      box-shadow: 0 2px 4px rgba(192, 57, 43, 0.2);
      font-family: "'Noto Serif SC', serif";
    }
    .chat-body {
      flex: 1;
      min-width: 0;
    }
    .chat-name-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      gap: 8px;
    }
    .chat-name {
      font-size: 12px;
      font-weight: 600;
      color: #C0392B;
    }
    .chat-name.is-anon {
      color: #6B7280;
      font-weight: 500;
    }
    .chat-content {
      font-size: 14px;
      color: #1F2937;
      line-height: 1.65;
      word-break: break-word;
      background: #fff;
      padding: 8px 12px;
      border-radius: 0 10px 10px 10px;
      border: 1px solid #F3F4F6;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }
    .chat-sender-row {
      margin-bottom: 8px;
    }
    .chat-name-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #BFDBFE;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    .chat-name-input:focus {
      outline: none;
      border-color: #3B82F6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    .chat-input {
      min-height: 72px;
      border-color: #BFDBFE;
    }
    .chat-input:focus {
      border-color: #3B82F6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    /* ========== 头衔徽章 ========== */
    .student-title-badge {
      display: inline-block;
      font-size: 11px;
      margin-right: 2px;
      color: #D97706;
      animation: badgePulse 2s ease-in-out infinite;
    }
    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.15); }
    }
    .mini-title-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      background: linear-gradient(135deg, #FDE68A, #F59E0B);
      color: #7C2D12;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      vertical-align: middle;
      font-family: sans-serif;
    }

    /* ========== 申请卡片高亮（邀请参与感） ========== */
    .apply-card {
      border: 2px dashed var(--cinnabar);
      background: linear-gradient(180deg, #FDF2F2 0%, #FFFFFF 100%);
      box-shadow: 0 4px 14px rgba(192, 57, 43, 0.08);
    }
    .apply-card .btn-primary {
      background: linear-gradient(135deg, #C0392B, #8B4513);
      padding: 12px;
      font-size: 15px;
      box-shadow: 0 4px 12px rgba(192, 57, 43, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .apply-card .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(192, 57, 43, 0.35);
    }

    /* ========== 小贴士卡片 ========== */
    .tips-card {
      background: linear-gradient(180deg, #FFFBEB 0%, #FFFFFF 100%);
      border: 1px solid #FDE68A;
    }

    /* 搜索框 */
    .search-box {
      margin-bottom: 16px;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--paper-dark);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--cinnabar);
      box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.1);
    }

    /* 弹窗 */
    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      background: #fff;
      border-radius: var(--radius-md);
      padding: 32px;
      width: 520px;
      max-width: 92vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }
    .modal-title {
      font-size: 22px; font-weight: 600;
      text-align: center;
      margin-bottom: 28px;
      color: var(--cinnabar);
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 14px;
      color: var(--ink-light);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--paper-dark);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--cinnabar);
      box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.1);
    }
    .form-row {
      display: flex; gap: 12px;
    }
    .form-row .form-group { flex: 1; }
    .form-actions {
      display: flex; justify-content: flex-end; gap: 10px;
      margin-top: 24px;
    }
    .password-error {
      color: var(--cinnabar);
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }

    /* 管理员页面 */
    .admin-page {
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .admin-header {
      background: linear-gradient(135deg, #2C2C2C 0%, #444 100%);
      color: #fff;
      padding: 16px 30px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .admin-title { font-size: 22px; letter-spacing: 3px; }
    .admin-content {
      flex: 1;
      padding: 24px 30px;
    }
    .admin-tabs {
      display: flex; gap: 10px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--paper-dark);
      padding-bottom: 12px;
    }
    .admin-tab {
      padding: 10px 24px;
      background: #fff;
      border: 2px solid var(--paper-dark);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .admin-tab:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
    .admin-tab.active {
      background: var(--cinnabar);
      color: #fff;
      border-color: var(--cinnabar);
    }
    .tab-badge {
      display: inline-block;
      min-width: 20px;
      height: 20px;
      line-height: 20px;
      text-align: center;
      background: #E74C3C;
      color: #fff;
      font-size: 12px;
      border-radius: 10px;
      padding: 0 6px;
      margin-left: 6px;
      font-weight: 600;
    }
    .admin-tab.active .tab-badge {
      background: #fff;
      color: var(--cinnabar);
    }

    .student-table {
      width: 100%;
      background: #fff;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 2px solid var(--paper-dark);
    }
    .table-header {
      display: flex;
      background: var(--paper-warm);
      padding: 12px 16px;
      font-weight: 600;
      border-bottom: 2px solid var(--paper-dark);
    }
    .table-row {
      display: flex;
      padding: 12px 16px;
      border-bottom: 1px solid var(--paper-dark);
      align-items: center;
      transition: background 0.2s ease;
    }
    .table-row:hover { background: var(--paper-warm); }
    .table-row:last-child { border-bottom: none; }
    .col-name { flex: 1.2; }
    .col-province { flex: 1; }
    .col-school { flex: 1.5; }
    .col-major { flex: 1.2; }
    .col-status { flex: 0.8; }
    .col-contact { flex: 1; } /* V4: 微信联系方式列 */
    .col-actions { flex: 1; text-align: right; }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-approved { background: #D5F5E3; color: #1E8449; }
    .status-pending { background: #FCF3CF; color: #B7950B; }

    .add-btn-wrap {
      margin-bottom: 16px;
      display: flex; justify-content: flex-end;
    }

    /* 印章效果 */
    .stamp {
      display: inline-block;
      padding: 4px 12px;
      border: 2px solid var(--cinnabar);
      color: var(--cinnabar);
      border-radius: 4px;
      font-size: 12px;
      transform: rotate(-5deg);
      font-weight: 600;
      opacity: 0.8;
    }

    /* 新增：密码管理 / 单聊会话 / 通用高亮 */
    .pwd-plain {
      display: inline-block;
      padding: 2px 10px;
      background: linear-gradient(135deg,#FEF3C7,#FCD34D);
      color: #78350F;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      letter-spacing: 1.5px;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid #F59E0B;
      box-shadow: 0 0 8px rgba(251,191,36,0.35);
    }
    .pwd-masked {
      display: inline-block;

    };
    // 姓名→首字母（支持中英混；中文无字典时用 Unicode 模 26 回退到 a-z）
    const toInitials = (name) => {
      if (!name) return '';
      const str = String(name).trim();
      if (!str) return '';
      // 中文拼音首字母常用字字典（前 500 高频字 + 拼音首字母；不在此字典走 Unicode 回退）
      const pinyinMap = {};
      let result = '';
      for (let i = 0; i < str.length; i++) {
        const ch = str.charCodeAt(i);
        // ASCII 字母 → 直接取小写首字母（取连续单词首字母）
        if ((ch >= 65 && ch <= 90) || (ch >= 97 && ch <= 122)) {
          if (i === 0 || !(
            (str.charCodeAt(i - 1) >= 65 && str.charCodeAt(i - 1) <= 90) ||
            (str.charCodeAt(i - 1) >= 97 && str.charCodeAt(i - 1) <= 122)
          )) {
            result += str[i].toLowerCase();
          }
          continue;
        }
        // 数字直接保留
        if (ch >= 48 && ch <= 57) { result += str[i]; continue; }
        // 中文 CJK 范围
        if (ch >= 0x4E00 && ch <= 0x9FFF) {
          // 字典映射；空字典直接回退
          const mapped = pinyinMap[str[i]];
          if (mapped) { result += mapped.toLowerCase(); continue; }
          // Unicode 回退：取相对偏移模 26，保证稳定同一字每次同字母
          const offset = (ch - 0x4E00) % 26;
          result += String.fromCharCode(97 + offset);
        }
        // 其他字符跳过（空格、符号）
      }
      return result.toLowerCase();
    };

      // 管理员收件箱用：会话列表
      conversations: [],
      // 当前选中会话的消息（管理员或同学端单聊）
      active: { studentId: null, studentName: '', messages: [] },
      // 同学端自己的会话消息（当 studentSession 存在时）
      mine: { messages: [] }
    });
    // 云端连接状态：'checking' | 'cloud' | 'error'
    const cloudStatus = ref('checking');
    const cloudError = ref('');
    const MAX_RETRY = 3;
    const RETRY_DELAY = 800;

    let idCounter = 1;
    let appIdCounter = 1;
    let msgIdCounter = 1;
    const nextId = () => idCounter++;
    const nextAppId = () => appIdCounter++;
    const nextMsgId = () => msgIdCounter++;

    // 管理员 token（登录成功后保存）
    let adminToken = localStorage.getItem('admin_token') || '';

    // ====== 带重试的 fetch（核心！）======
    // 绝不降级为本地存储，失败就重试，再失败就抛出错误给用户
    const fetchWithRetry = async (url, options = {}, describe = '请求') => {
      let lastErr = null;
      for (let i = 1; i <= MAX_RETRY; i++) {
        try {
          console.log(`[Cloud] 第 ${i}/${MAX_RETRY} 次尝试: ${describe}`);
          const res = await fetch(url, options);
          if (res.ok) {
            const text = await res.text();
            let data;
            try { data = text ? JSON.parse(text) : null; } catch { data = text; }
            return { ok: true, status: res.status, data };
          }
          const errText = await res.text().catch(() => '');
          let errMsg = `HTTP ${res.status}`;
          try {
            const errJson = JSON.parse(errText);
            if (errJson.error) errMsg += ': ' + errJson.error;
          } catch {}
          lastErr = new Error(errMsg);
          console.warn(`[Cloud] ${describe} 第 ${i} 次失败: ${errMsg}`);
        } catch (e) {
          lastErr = e;
          console.warn(`[Cloud] ${describe} 第 ${i} 次网络异常: ${e.message}`);
        }
        if (i < MAX_RETRY) {
          await new Promise(r => setTimeout(r, RETRY_DELAY * i));
        }
      }
      throw lastErr;
    };

    // 数据提供者：**仅云端模式**，3次重试，绝不降级本地
    const DataProvider = {
      _getHeaders(needAdmin = false, needStudent = false) {
        const headers = { 'Content-Type': 'application/json' };
        if (needAdmin && adminToken) headers['X-Admin-Token'] = adminToken;
        if (needStudent && studentSession.value && studentSession.value.token) {
          headers['X-Student-Token'] = studentSession.value.token;
        }
        return headers;
      },
      // ========= 响应式数据属性（供 DataProvider.xxx 直接使用）=========
      get studentSession() { return studentSession.value; },
      set studentSession(v) { studentSession.value = v; },
      get communities() { return communitiesStore.list || []; },
      get communityRequests() {
        return {
          create: communitiesStore.allCreateReqs || [],
          join: communitiesStore.allJoinReqs || [],
          pendingCreate: communitiesStore.pendingCreateReqs || [],
          pendingJoin: communitiesStore.pendingJoinReqs || []
        };
      },
      get myCommunity() {
        const sess = studentSession.value;
        if (!sess || !sess.student || !sess.student.communityId) return null;
        return (communitiesStore.list || []).find(c => String(c.id) === String(sess.student.communityId)) || null;
      },
      get isMyCommunityOwner() {
        const me = this.myCommunity;
        const sess = studentSession.value;
        if (!me || !sess || !sess.student) return false;
        return String(me.ownerId) === String(sess.student.id);
      },
      get directMineMessages() { return (directMessagesStore.mine && directMessagesStore.mine.messages) || []; },

      getCloudStatus() { return { status: cloudStatus.value, error: cloudError.value }; },

      // 启动时检测云端是否可用
      async checkCloud() {
        cloudStatus.value = 'checking';
        cloudError.value = '';
        try {
          const r = await fetchWithRetry('/api/messages', {}, '云端可用性检测');
          if (Array.isArray(r.data)) {
            cloudStatus.value = 'cloud';
            console.log('[Cloud] ✅ 云端连接成功，所有数据将实时共享');
            return true;
          }
          throw new Error('返回数据格式错误');
        } catch (e) {
          cloudStatus.value = 'error';
          cloudError.value = e.message;
          console.error('[Cloud] ❌ 云端连接失败:', e.message);
          return false;
        }
      },

      // ===== 学生档案 =====
      async getStudents() {
        const r = await fetchWithRetry('/api/students', { headers: this._getHeaders(true) }, '获取学生档案');
        if (Array.isArray(r.data)) {
          studentsStore.list = r.data;
          if (r.data.length > 0) idCounter = Math.max(...r.data.map(s => s.id), 0) + 1;
          return r.data;
        }
        throw new Error('学生数据格式错误');
      },
      async addStudent(student) {
        if (!adminToken) throw new Error('请先登录管理员账号');
        const r = await fetchWithRetry('/api/students', {
          method: 'POST',
          headers: this._getHeaders(true),
          body: JSON.stringify(student)
        }, `添加学生:${student.nickname}`);
        studentsStore.list.push(r.data);
        return r.data;
      },
      async updateStudent(id, updates) {
        if (!adminToken) throw new Error('请先登录管理员账号');
        const r = await fetchWithRetry(`/api/students/${id}`, {
          method: 'PUT',
          headers: this._getHeaders(true),
          body: JSON.stringify(updates)
        }, `更新学生 id:${id}`);
        const idx = studentsStore.list.findIndex(s => s.id == id);
        if (idx > -1) studentsStore.list[idx] = r.data;
        return r.data;
      },
      async deleteStudent(id) {
        if (!adminToken) throw new Error('请先登录管理员账号');
        await fetchWithRetry(`/api/students/${id}`, {
          method: 'DELETE',
          headers: this._getHeaders(true)
        }, `删除学生 id:${id}`);
        const idx = studentsStore.list.findIndex(s => s.id == id);
        if (idx > -1) studentsStore.list.splice(idx, 1);
        return true;
      },

      // ===== 待审核申请 =====
      async getPending() {
        if (!adminToken) throw new Error('请先登录管理员账号');
        const r = await fetchWithRetry('/api/pending', {
          headers: this._getHeaders(true)
        }, '获取待审核申请');
        if (Array.isArray(r.data)) {
          pendingApplications.list = r.data;
          if (r.data.length > 0) appIdCounter = Math.max(...r.data.map(s => s.id), 0) + 1;
          return r.data;
        }
        throw new Error('待审核数据格式错误');
      },
      async addPending(app) {
        const r = await fetchWithRetry('/api/pending', {
          method: 'POST',
          headers: this._getHeaders(false),
          body: JSON.stringify(app)
        }, `提交申请:${app.nickname}`);
        pendingApplications.list.push(r.data);
        return r.data;
      },
      async removePending(id) {
        if (!adminToken) throw new Error('请先登录管理员账号');
        await fetchWithRetry(`/api/pending/${id}`, {
          method: 'DELETE',
          headers: this._getHeaders(true)
        }, `删除待审核 id:${id}`);
        const idx = pendingApplications.list.findIndex(s => s.id == id);
        if (idx > -1) pendingApplications.list.splice(idx, 1);
        return true;
      },

      // ===== 留言 =====
      async getMessages() {
        const r = await fetchWithRetry('/api/messages', {}, '获取留言');
        if (Array.isArray(r.data)) {
          messagesStore.list = r.data;
          if (r.data.length > 0) msgIdCounter = Math.max(...r.data.map(m => m.id), 0) + 1;
          return r.data;
        }
        throw new Error('留言数据格式错误');
      },
      async addMessage({ content, name, studentName, studentPassword }) {
        // 优先使用同学会话头（X-Student-Token）；否则回落到姓名+密码（兼容老调用）
        const hasStudentToken = !!(studentSession.value && studentSession.value.token);
        const payload = { content };
        if (!hasStudentToken) {
          payload.studentName = (studentName || name || '').trim();
          payload.studentPassword = (studentPassword || '').trim();
        }
        const r = await fetchWithRetry('/api/messages', {
          method: 'POST',
          headers: this._getHeaders(false, true),
          body: JSON.stringify(payload)
        }, '发送留言');
        messagesStore.list.push(r.data);
        return r.data;
      },
      async deleteMessage(id) {
        if (!adminToken) throw new Error('请先登录管理员账号');
        await fetchWithRetry(`/api/messages/${id}`, {
          method: 'DELETE',
          headers: this._getHeaders(true)
        }, `删除留言 id:${id}`);
        const idx = messagesStore.list.findIndex(m => m.id == id);
        if (idx > -1) messagesStore.list.splice(idx, 1);
        return true;
      },

      // ===== 公告 =====
      async getAnnouncements() {
        const r = await fetchWithRetry('/api/announcements', {
          headers: this._getHeaders(false)
        }, '读取公告');
        announcementsStore.list = Array.isArray(r.data) ? r.data : [];
        return announcementsStore.list;
      },
      async addAnnouncement({ title, content, pinned = false }) {
        if (!adminToken) throw new Error('请先登录管理员账号');
        const r = await fetchWithRetry('/api/announcements', {
          method: 'POST',
          headers: this._getHeaders(true),
          body: JSON.stringify({ title, content, pinned })
        }, '发布公告');
        announcementsStore.list = [r.data, ...announcementsStore.list.filter(a => a.id !== r.data.id)];
        announcementsStore.list.sort((a, b) => (b.id || 0) - (a.id || 0));
        return r.data;
      },
      async deleteAnnouncement(id) {
        if (!adminToken) throw new Error('请先登录管理员账号');
        await fetchWithRetry(`/api/announcements/${id}`, {
          method: 'DELETE',
          headers: this._getHeaders(true)
        }, `删除公告 id:${id}`);
        const idx = announcementsStore.list.findIndex(a => a.id == id);
        if (idx > -1) announcementsStore.list.splice(idx, 1);
      },
      async updateAnnouncement(id, { title, content, pinned }) {
        if (!adminToken) throw new Error('请先登录管理员账号');
        const r = await fetchWithRetry(`/api/announcements/${id}`, {
          method: 'PUT',
          headers: this._getHeaders(true),
          body: JSON.stringify({ title, content, pinned })
        }, `修改公告 id:${id}`);
        const idx = announcementsStore.list.findIndex(a => a.id == id);
        if (idx > -1) announcementsStore.list.splice(idx, 1, r.data);
        announcementsStore.list.sort((a, b) => (b.id || 0) - (a.id || 0));
        return r.data;
      },

      // ===== 管理员登录 =====
      async adminLogin(password) {
        try {
          const r = await fetchWithRetry('/api/admin-login', {
            method: 'POST',
            headers: this._getHeaders(false),
            body: JSON.stringify({ password })
          }, '管理员登录');
          if (r.data && r.data.success) {
            adminToken = r.data.token;
            localStorage.setItem('admin_token', adminToken);
            localStorage.setItem('admin_authed', '1');
            return true;
          }
          return false;
        } catch (e) {
          console.error('[Admin] 云端管理员登录校验失败，请确认：\n1. Netlify 环境变量 ADMIN_PASSWORD 是否已配置\n2. admin-login Function 是否正常部署（Deploys 页面查看日志）\n错误详情：', e && e.message);
          return false;
        }
      },
      adminLogout() {
        adminToken = '';
        localStorage.removeItem('admin_token');
        localStorage.removeItem('admin_authed');
      },
      isAdmin() { return !!adminToken; },

      // ===== 同学端：登录 / 会话 / 登出 =====
      async studentLogin(studentName, studentPassword) {
        const r = await fetchWithRetry('/api/student-login', {
          method: 'POST',
          headers: this._getHeaders(false),
          body: JSON.stringify({ studentName, studentPassword })
        }, '同学登录');
        if (r.data && r.data.ok) {
          sessionStorage.setItem('STUDENT_TOKEN', r.data.token);
          sessionStorage.setItem('STUDENT_INFO', JSON.stringify(r.data.student));
          studentSession.value = { token: r.data.token, student: r.data.student };
          return r.data;
        }
        throw new Error((r.data && r.data.error) || '登录失败');
      },
      async verifyStudentSession(token) {
        const r = await fetchWithRetry('/api/student-login/me', {
          method: 'POST',
          headers: this._getHeaders(false),
          body: JSON.stringify({ token })
        }, '同学会话校验');
        if (r.data && r.data.ok) {
          sessionStorage.setItem('STUDENT_INFO', JSON.stringify(r.data.student));
          studentSession.value = { token, student: r.data.student };
          return r.data.student;
        }
        return null;
      },
      studentLogout() {
        sessionStorage.removeItem('STUDENT_TOKEN');
        sessionStorage.removeItem('STUDENT_INFO');
        studentSession.value = null;
        // 清同学端自己的 DM
        if (directMessagesStore.mine) directMessagesStore.mine.messages = [];
      },
      refreshStudentInfo(patch = {}) {
        const cur = studentSession.value;
        if (!cur || !cur.student) return;
        const next = { ...cur.student, ...patch };
        studentSession.value = { ...cur, student: next };
        sessionStorage.setItem('STUDENT_INFO', JSON.stringify(next));
      },

      // ===== 同学退社（需要密码二次确认；X-Student-Token 验证身份一致性）=====
      async leaveCommunity(studentPasswordFromUI) {
        const sess = studentSession.value;
        if (!sess || !sess.student) throw new Error('请先登录同学身份');
        const studentId = sess.student.id;
        const studentPassword = String(studentPasswordFromUI || '').trim();
        if (!studentPassword) throw new Error('退社需输入您的密码以确认身份');
        const r = await fetchWithRetry(`/api/students/${studentId}/leave-community`, {
          method: 'POST',
          headers: this._getHeaders(false, true),
          body: JSON.stringify({ studentPassword })
        }, '退出社区');
        if (r.data && r.data.ok) {
          this.refreshStudentInfo({ communityId: null, communityName: '' });
          const idx = studentsStore.list.findIndex(s => String(s.id) === String(studentId));
          if (idx > -1) {
            studentsStore.list[idx] = { ...studentsStore.list[idx], communityId: null, communityName: '' };
          }
          return r.data;
        }
        throw new Error((r.data && r.data.error) || '退社失败');
      },

      // ===== 管理员：密码管理 =====
      async batchFillPasswords() {
        if (!adminToken) throw new Error('请先登录管理员');
        const r = await fetchWithRetry('/api/students/batch-fill-passwords', {
          method: 'POST',
          headers: this._getHeaders(true)
        }, '批量补密码');
        if (r.data && r.data.ok) {
          // 刷新列表获取新密码
          await this.getStudents();
          return { filled: r.data.filledCount, total: r.data.total, ...r.data };
        }
        throw new Error((r.data && r.data.error) || '批量补密码失败');
      },
      async resetPassword(id) {
        if (!adminToken) throw new Error('请先登录管理员');
        const r = await fetchWithRetry(`/api/students/${id}/reset-password`, {
          method: 'POST',
          headers: this._getHeaders(true)
        }, `重置密码 id:${id}`);
        if (r.data && r.data.ok) {
          const idx = studentsStore.list.findIndex(s => s.id == id);
          if (idx > -1) studentsStore.list[idx].password = r.data.newPassword;
          // 返回与 UI 兼容：{ password }
          return { password: r.data.newPassword, ...r.data };
        }
        throw new Error((r.data && r.data.error) || '重置密码失败');
      },

      // ===== 社区 =====
      async loadCommunities() {
        const data = await this.getCommunities();
        return data;
      },
      async loadCommunityRequests() {
        // 申请详情通过 getCommunities 管理员接口已经返回
        const data = await this.getCommunities();
        communityRequestsStore.value = {
          create: (data && data.allCreateReqs) || communitiesStore.allCreateReqs || [],
          join: (data && data.allJoinReqs) || communitiesStore.allJoinReqs || []
        };
        return communityRequestsStore.value;
      },
      async getCommunities() {
        const r = await fetchWithRetry('/api/communities', {
          headers: this._getHeaders(true)
        }, '获取社区列表');
        const payload = r.data || { communities: [] };
        communitiesStore.list = payload.communities || [];
        // 字段规范化：老数据 communityName → name / communityIntro → intro / applyNote → note；新增 wechatContact 透传
        const rawCreate = payload.allCreateReqs || [];
        communitiesStore.allCreateReqs = rawCreate.map(r => ({
          ...r,
          name: r.name || r.communityName || '',
          intro: r.intro || r.communityIntro || '',
          wechatContact: r.wechatContact || r.wechat || ''
        }));
        const rawJoin = payload.allJoinReqs || [];
        communitiesStore.allJoinReqs = rawJoin.map(r => ({
          ...r,
          note: r.note || r.applyNote || '',
          wechatContact: r.wechatContact || r.wechat || ''
        }));
        communitiesStore.pendingCreateReqs = communitiesStore.allCreateReqs.filter(x => x.status === 'pending');
        communitiesStore.pendingJoinReqs = communitiesStore.allJoinReqs.filter(x => x.status === 'pending');
        return payload;
      },
      async requestCommunityCreate({ name, intro, password, wechat }) {
        const sess = studentSession.value;
        if (!sess || !sess.student) throw new Error('请先登录同学身份');
        const studentName = (sess.student.nickname || '').trim();
        const communityName = String(name || '').trim();
        const communityIntro = String(intro || '').trim();
        const studentPassword = String(password || '').trim();
        const wechatContact = String(wechat || '').trim();
        if (!studentPassword) throw new Error('请输入您的密码以验证身份');
        if (!wechatContact) throw new Error('请填写微信号');
        if (!communityName) throw new Error('请填写社区名称');
        const r = await fetchWithRetry('/api/communities/create-request', {
          method: 'POST',
          headers: this._getHeaders(false),
          body: JSON.stringify({ studentName, studentPassword, communityName, communityIntro, wechatContact })
        }, '申请创建社区');
        if (r.data && r.data.ok) return r.data;
        throw new Error((r.data && r.data.error) || '申请创建社区失败');
      },
      async requestCommunityJoin({ communityId, password, note, wechat }) {
        const sess = studentSession.value;
        if (!sess || !sess.student) throw new Error('请先登录同学身份');
        const studentName = (sess.student.nickname || '').trim();
        const studentPassword = String(password || '').trim();
        const wechatContact = String(wechat || '').trim();
        if (!studentPassword) throw new Error('请输入您的密码以验证身份');
        if (!wechatContact) throw new Error('请填写微信号');
        if (!communityId) throw new Error('请选择要加入的社区');
        const r = await fetchWithRetry('/api/communities/join-request', {
          method: 'POST',
          headers: this._getHeaders(false),
          body: JSON.stringify({ studentName, studentPassword, communityId, applyNote: note || '', wechatContact })
        }, '申请加入社区');
        if (r.data && r.data.ok) return r.data;
        throw new Error((r.data && r.data.error) || '申请加入社区失败');
      },
      async approveCommunityCreate(id) {
        if (!adminToken) throw new Error('请先登录管理员');
        const r = await fetchWithRetry(`/api/communities/create-request/${id}/approve`, {
          method: 'POST',
          headers: this._getHeaders(true)
        }, `审批创建社区通过 req:${id}`);
        if (r.data && r.data.ok) {
          await this.loadCommunities();
          if (communityRequestsStore.value) await this.loadCommunityRequests();
          return r.data;
        }
        throw new Error((r.data && r.data.error) || '审批失败');
      },
      async rejectCommunityCreate(id, reason = '') {
        if (!adminToken) throw new Error('请先登录管理员');
        const r = await fetchWithRetry(`/api/communities/create-request/${id}/reject`, {
          method: 'POST',
          headers: this._getHeaders(true),
          body: JSON.stringify({ reason })
        }, `拒绝创建社区 req:${id}`);
        if (r.data && r.data.ok) {
          await this.loadCommunities();
          if (communityRequestsStore.value) await this.loadCommunityRequests();
          return r.data;
        }
        throw new Error((r.data && r.data.error) || '拒绝失败');
      },
      async approveCommunityJoin(id, opt = {}) {
        // 管理员或社长均可以审批；管理员走 X-Admin-Token，社长走 X-Student-Token
        const role = opt.role || (adminToken ? 'admin' : 'owner');
        const r = await fetchWithRetry(`/api/communities/join-request/${id}/approve`, {
          method: 'POST',
          headers: this._getHeaders(role === 'admin', role === 'owner'),
          body: JSON.stringify(role === 'owner'
            ? { studentName: opt.studentName, studentPassword: opt.studentPassword }
            : {})
        }, `审批加入社区 req:${id}`);
        if (r.data && r.data.ok) {
          await this.loadCommunities();
          if (communityRequestsStore.value) await this.loadCommunityRequests();
          return r.data;
        }
        throw new Error((r.data && r.data.error) || '加入审批失败');
      },
      async rejectCommunityJoin(id, opt = {}) {
        const role = opt.role || (adminToken ? 'admin' : 'owner');
        const r = await fetchWithRetry(`/api/communities/join-request/${id}/reject`, {
          method: 'POST',
          headers: this._getHeaders(role === 'admin', role === 'owner'),
          body: JSON.stringify(role === 'owner'
            ? { studentName: opt.studentName, studentPassword: opt.studentPassword, reason: opt.reason || '' }
            : { reason: opt.reason || '' })
        }, `拒绝加入社区 req:${id}`);
        if (r.data && r.data.ok) {
          await this.loadCommunities();
          if (communityRequestsStore.value) await this.loadCommunityRequests();
          return r.data;
        }
        throw new Error((r.data && r.data.error) || '拒绝失败');
      },
      async transferCommunityOwner(communityId, targetStudentId, opt = {}) {
        const role = opt.role || (adminToken ? 'admin' : 'owner');
        // 如果是社长操作，session 已注入，X-Student-Token 自动带，密码不强制
        let body;
        if (role === 'owner') {
          const sess = studentSession.value;
          body = {
            studentName: opt.studentName || (sess && sess.student && sess.student.nickname) || '',
            studentPassword: opt.studentPassword || '',
            targetStudentId
          };
        } else {
          body = { targetStudentId };
        }
        const r = await fetchWithRetry(`/api/communities/${communityId}/transfer`, {
          method: 'POST',
          headers: this._getHeaders(role === 'admin', role === 'owner'),
          body: JSON.stringify(body)
        }, `转让社区 ${communityId} -> ${targetStudentId}`);
        if (r.data && r.data.ok) {
          await this.loadCommunities();
          // 如果当前会话是转让相关的学生，刷新其社区身份头衔
          const sess = studentSession.value;
          if (sess && sess.student && (String(sess.student.id) === String(targetStudentId) || this.isMyCommunityOwner)) {
            const me = (studentsStore.list || []).find(x => String(x.id) === String(sess.student.id));
            if (me) this.refreshStudentInfo({ titleLevel: me.titleLevel });
          }
          return r.data;
        }
        throw new Error((r.data && r.data.error) || '转让失败');
      },
      // V4: 设置/清除副社长（仅社长/管理员可调）
      async setDeputy(communityId, action, deputyId, opt = {}) {
        const role = opt.role || (adminToken ? 'admin' : 'owner');
        let body;
        if (role === 'owner') {
          const sess = studentSession.value;
          body = {
            action: action || 'set',
            deputyId: deputyId || null,
            studentName: opt.studentName || (sess && sess.student && sess.student.nickname) || '',
            studentPassword: opt.studentPassword || ''
          };
        } else {
          body = { action: action || 'set', deputyId: deputyId || null };
        }
        const r = await fetchWithRetry(`/api/communities/${communityId}/deputy`, {
          method: 'POST',
          headers: this._getHeaders(role === 'admin', role === 'owner'),
          body: JSON.stringify(body)
        }, `设置副社长 ${communityId}`);
        if (r.data && r.data.ok) {
          await this.loadCommunities();
          return r.data;
        }
        throw new Error((r.data && r.data.error) || '设置副社长失败');
      },
      // V4: 唐榜
      async getTangRank() {
        const r = await fetchWithRetry('/api/tang-rank', {
          method: 'GET',
          headers: this._getHeaders(false, !!studentSession.value)
        }, '拉取唐榜');
        return r.data;
      },
      async voteTang(candidateId) {
        if (!studentSession.value) throw new Error('请先使用同学身份登录');
        const r = await fetchWithRetry('/api/tang-rank/vote', {
          method: 'POST',
          headers: this._getHeaders(false, true),
          body: JSON.stringify({ candidateId })
        }, `唐榜投票 -> ${candidateId}`);
        if (r.data && r.data.ok) return r.data;
        throw new Error((r.data && r.data.error) || '投票失败');
      },
      async adminRemoveMember(communityId, studentId) {
        if (!adminToken) throw new Error('请先登录管理员');
        const r = await fetchWithRetry(`/api/communities/${communityId}/remove-member`, {
          method: 'POST',
          headers: this._getHeaders(true),
          body: JSON.stringify({ studentId })
        }, `管理员移出社员 ${studentId} 从社区 ${communityId}`);
        if (r.data && r.data.ok) {
          await this.loadCommunities();
          const idx = studentsStore.list.findIndex(s => String(s.id) === String(studentId));
          if (idx > -1) {
            studentsStore.list[idx] = { ...studentsStore.list[idx], communityId: null, communityName: '' };

          const sess = studentSession.value;
          if (sess && sess.student && String(sess.student.id) === String(studentId)) {

          if (communityRequestsStore.value) await this.loadCommunityRequests();
          return r.data;
        }
        throw new Error((r.data && r.data.error) || '删除失败');

      // ===== 单聊（同学 ↔ 管理员） =====
      async loadDirectMessages(markRead = true) {
        // 管理员端：返回会话列表；同学端：返回自己会话的消息
        const sess = studentSession.value;
        if (adminToken) {
          const list = await this.getDirectMessages({});
          return list && list.total ? 0 : 0;
        }
        if (sess && sess.student) {
          const qs = {
            studentId: String(sess.student.id),
            studentName: sess.student.nickname || '',
            // 同学端 API 支持密码鉴权，用 header token 也行，这里密码没存，给 token 就行
            studentPassword: '__xst__'
          };
          // 直接调接口同时带 X-Student-Token，后端若有 header 优先 header
          const r = await fetchWithRetry(
            `/api/direct-messages?studentId=${encodeURIComponent(qs.studentId)}&studentName=${encodeURIComponent(qs.studentName)}&studentPassword=__unused__`,
            { headers: this._getHeaders(false, true) },
            '读取同学单聊消息'
          );
          const data = r.data || {};
          if (data && data.mode === 'conversation' && Array.isArray(data.messages)) {
            // 标记已读（如果需要）
            if (markRead && data.messages.some(m => m.sender === 'admin' && !m.read)) {
              try { await this.markDirectMessagesRead({ studentName: sess.student.nickname, studentPassword: '__unused__' }); } catch {}
            }
            directMessagesStore.mine.messages = data.messages;
            return 0;
          }
          return 0;
        }
        return 0;
      },
      async getDirectMessages(opt = {}) {
        const qs = [];
        if (opt.studentId) qs.push(`studentId=${encodeURIComponent(opt.studentId)}`);
        if (opt.studentName) qs.push(`studentName=${encodeURIComponent(opt.studentName)}`);
        if (opt.studentPassword) qs.push(`studentPassword=${encodeURIComponent(opt.studentPassword)}`);
        const url = '/api/direct-messages' + (qs.length ? `?${qs.join('&')}` : '');
        const r = await fetchWithRetry(url, { headers: this._getHeaders(true) }, '读取单聊消息');
        const data = r.data;
        // 管理员返回列表模式：更新 conversations；返回对话模式：更新 active
        if (data && data.mode === 'list') {
          directMessagesStore.conversations = data.conversations || [];
        } else if (data && data.mode === 'conversation') {
          directMessagesStore.active = {
            studentId: data.studentId,
            studentName: data.studentName,
            messages: data.messages || []
          };
        }
        return data;
      },
      async markDirectReadByStudent(studentId) {
        if (!adminToken) return null;
        const r = await fetchWithRetry('/api/direct-messages/mark-read', {
          method: 'POST',
          headers: this._getHeaders(true),
          body: JSON.stringify({ studentId })
        }, '管理员标某会话已读');
        // 刷新左侧未读红点
        await this.getDirectMessages({});
        // 刷新当前 active 的消息未读
        if (studentId && directMessagesStore.active && String(directMessagesStore.active.studentId) === String(studentId)) {
          await this.getDirectMessages({ studentId });
        }
        return r.data;
      },
      async sendDirectMessage(payload) {
        // 同学端调用：payload 是 string 内容，按学生身份构造 body
        const sess = studentSession.value;
        if (!sess || !sess.student) throw new Error('请先登录同学身份');
        const content = typeof payload === 'string' ? String(payload) : String(payload.content || '');
        if (!content.trim()) throw new Error('内容不能为空');
        const r = await fetchWithRetry('/api/direct-messages', {
          method: 'POST',
          headers: this._getHeaders(false, true),
          body: JSON.stringify({
            studentName: sess.student.nickname || '',
            studentPassword: '__unused__',
            content
          })
        }, '发送单聊消息');
        if (r.data && r.data.ok) {
          // 乐观更新
          if (directMessagesStore.mine) {
            directMessagesStore.mine.messages = [...(directMessagesStore.mine.messages || []), r.data.message];
          }
          return r.data;
        }
        throw new Error((r.data && r.data.error) || '发送失败');
      },
      async sendDirectMessageAsAdmin(studentId, content) {
        if (!adminToken) throw new Error('请先登录管理员');
        const r = await fetchWithRetry('/api/direct-messages', {
          method: 'POST',
          headers: this._getHeaders(true),
          body: JSON.stringify({ studentId, content })
        }, `管理员回复单聊 ${studentId}`);
        if (r.data && r.data.ok) {
          // 乐观更新当前 active 消息列表
          if (directMessagesStore.active && String(directMessagesStore.active.studentId) === String(studentId)) {
            directMessagesStore.active.messages = [...(directMessagesStore.active.messages || []), r.data.message];
          }
          return r.data;
        }
        throw new Error((r.data && r.data.error) || '发送失败');
      },
      async markDirectMessagesRead(opt = {}) {
        const isAdminCall = !!(adminToken && (opt.studentId || Object.keys(opt).length === 0));
        const r = await fetchWithRetry('/api/direct-messages/mark-read', {
          method: 'POST',
          headers: this._getHeaders(isAdminCall, !isAdminCall),
          body: JSON.stringify(opt)
        }, '标已读');
        return r.data;
      }
    };
