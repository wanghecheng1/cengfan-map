              <!-- 1. 公告栏：放在最顶部，最显眼（无论有没有公告都显示卡片，空时有快捷发布入口） -->
              <div class="info-card notice-card">
                <div class="info-card-title calligraphy" style="color:#C0392B;border-bottom:2px dashed #F5C842;">
                  📢 最新公告栏
                  <span v-if="isAdmin" class="message-count" style="cursor:pointer;color:var(--cinnabar);" @click="$emit('openAdmin', 'announcement')">
                    {{ announcements.length > 0 ? '管理 →' : '发布首条 →' }}
                  </span>
                  <span v-else class="message-count">{{ announcements.length }}条</span>
                </div>
                <!-- 空状态：还没公告 -->
                <div v-if="announcements.length === 0" style="padding:28px 12px;text-align:center;">
                  <div style="font-size:48px;margin-bottom:10px;">📭</div>
                  <div style="font-size:14px;color:#92400E;margin-bottom:6px;">暂无公告</div>
                  <div v-if="isAdmin" style="font-size:13px;color:#B45309;">
                    点右上角「发布首条」快速发布第一条公告！
                  </div>
                  <div v-else style="font-size:13px;color:#A16207;">
                    管理员即将发布最新动态，敬请期待
                  </div>
                </div>
                <div v-else style="display:flex;flex-direction:column;gap:12px;">
                  <div
                    v-for="(item, idx) in announcements"
                    :key="item.id"
                    class="announcement-item"
                    :class="{ 'is-pinned': item.pinned }"
                    :style="{ animationDelay: idx * 0.04 + 's' }"
                  >
                    <div class="announcement-head">
                      <span class="announcement-title">
                        <span v-if="item.pinned" class="pinned-badge">📌 置顶</span>
                        <b>{{ item.title || '📣 公告' }}</b>
                      </span>
                      <span class="announcement-date">{{ item.created_at }}</span>
                    </div>
                    <div class="announcement-content" style="white-space:pre-wrap;">{{ item.content }}</div>
                  </div>
                </div>
              </div>

              <!-- 2. 统计数据 -->
              <div class="info-card">
                <div class="info-card-title calligraphy">📊 统计数据</div>
                <div class="stat-item">
                  <span class="stat-label">同学总数</span>
                  <span class="stat-value">{{ totalCount }}</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">覆盖省份</span>
                  <span class="stat-value">{{ provinceCount }}</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">大学数量</span>
                  <span class="stat-value">{{ universityCount }}</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">找饭搭子</span>
                  <span class="stat-value">{{ foodCount }}</span>
                </div>
              </div>

              <!-- 3. 申请加入入口 -->
              <div class="info-card apply-card">
                <div class="info-card-title calligraphy">📝 我要加入</div>
                <div style="font-size:13px;color:#666;line-height:1.8;margin-bottom:12px;">
                  入站点这里 <br> 等待站主审核
                </div>
                <button class="btn btn-primary" style="width:100%;font-weight:600;" @click="showApply = true">
                  🚀 立即申请加入
                </button>
              </div>

              <!-- 3.5 社区板块：社区列表 + 申请入口 -->
              <div class="info-card notice-card" style="background:linear-gradient(180deg,#FFFDF7 0%,#EFF6FF 100%);border-color:#BFDBFE;">
                <div class="info-card-title calligraphy" style="color:#1E3A8A;border-bottom:2px dashed #93C5FD;">
                  🏛️ 社区广场
                  <span class="message-count">{{ communities.length }}个社区 · 加入一起玩</span>
                </div>
                <!-- 快捷按钮区 -->
                <div style="display:flex;gap:8px;margin:10px 0 14px 0;flex-wrap:wrap;">
                  <button
                    class="btn btn-primary"
                    @click="openCreateCommunity"
                    :disabled="studentSession && studentSession.student && studentSession.student.communityId"
                    :title="studentSession && studentSession.student && studentSession.student.communityId ? '你已在一个社区中，请先退社再新建' : '未登录将先弹出同学登录'"
                    style="flex:1;min-width:45%;background:linear-gradient(135deg,#8B5CF6,#7C3AED);border-color:#6D28D9;"
                  >
                    🏗️ 申请创建新社区
                  </button>
                  <button
                    class="btn btn-secondary"
                    style="flex:1;min-width:45%;"
                    @click="() => { if (!studentSession) { showStudentLogin = true; } else if (communities.length === 0) { alert('目前还没有社区，来创建第一个吧！'); } else { openJoinCommunity(communities[0]); } }"
                    :disabled="studentSession && studentSession.student && studentSession.student.communityId"
                  >
                    🎯 申请加入社区
                  </button>
                </div>
                <!-- 空状态 -->
                <div v-if="communities.length === 0" style="padding:24px 0;text-align:center;">
                  <div style="font-size:40px;margin-bottom:8px;">🏘️</div>
                  <div style="font-size:13px;color:#64748B;">还没有社区被创建</div>
                  <div style="font-size:12px;color:#94A3B8;margin-top:4px;">登录后点「申请创建新社区」成为第一个社长吧！</div>
                </div>
                <!-- 社区列表 -->
                <div v-else style="display:flex;flex-direction:column;gap:10px;">
                  <div
                    v-for="(c, idx) in communities"
                    :key="c.id"
                    class="community-card"
                    :style="{ animationDelay: idx*0.03 + 's' }"
                  >
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                      <div style="flex:1;">
                        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                          <span style="font-weight:700;color:#0F172A;font-size:15px;">{{ c.name }}</span>
                          <span v-if="studentSession && studentSession.student && studentSession.student.communityId === c.id" class="msg-tag community-owner" style="font-size:11px;">✅ 我所在</span>
                          <span v-else-if="myCommunity && myCommunity.id !== c.id" class="msg-tag community" style="font-size:11px;background:#FEF3C7;color:#92400E;">其他社区</span>
                        </div>
                        <div v-if="c.intro" style="font-size:13px;color:#475569;margin-top:4px;line-height:1.6;">{{ c.intro }}</div>
                        <div style="font-size:12px;color:#64748B;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;">
                          <span>👑 社长：{{ c.ownerName || c.ownerId }}</span>
                          <span>👥 成员：{{ c.memberCount || (c.memberIds && c.memberIds.length) || 0 }}</span>
                        </div>
                      </div>
                      <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;">
                        <button
                          class="btn btn-sm btn-primary"
                          style="background:linear-gradient(135deg,#0EA5E9,#0284C7);border-color:#0284C7;"
                          :disabled="!studentSession || (studentSession.student && !!studentSession.student.communityId)"
                          @click="openJoinCommunity(c)"
                        >
                          🎯 加入
                        </button>
                        <!-- V4: 打开社区独立完整页（游客/所有人都能看完整页） -->
                        <button
                          class="btn btn-sm btn-secondary"
                          style="background:linear-gradient(135deg,#60A5FA,#3B82F6);color:#fff;border-color:#2563EB;"
                          @click="$emit('navigate', 'community', c)"
                        >
                          📖 完整页
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- 聊天板（实名/匿名 可切换） -->
              <div class="info-card message-card chat-card">
                <div class="info-card-title calligraphy">
                  💬 同学聊天板
                  <span class="message-count">{{ messages.length }}条 · 想说就说</span>
                </div>
                <div class="message-list chat-list" ref="messageListRef">
                  <div v-if="messages.length === 0" style="text-align:center;padding:30px 0;color:#999;font-size:13px;">
                    还没人说话，抢个沙发吧~
                  </div>
                  <div
                    v-for="(msg, idx) in messages"
                    :key="msg.id"
                    class="chat-bubble"
                    :style="{ animationDelay: idx * 0.02 + 's' }"
                  >
                    <div class="chat-avatar" :class="{
                      'chat-avatar--anon': msg.name === '匿名校友',
                      'chat-avatar--me': false
                    }">
                      {{ (msg.name || '匿').slice(0, 1) }}
                    </div>
                    <div class="chat-body">
                      <div class="chat-name-row" style="flex-wrap:wrap;">
                        <!-- 规则：匿名校友 → 灰标；含(社区) → 实名绿标 + 社区蓝标；否则 → 实名绿标 -->
                        <template v-if="msg.name === '匿名校友'">
                          <span class="msg-tag anonymous">🎭 匿名校友</span>
                        </template>
                        <template v-else-if="msg.name && msg.name.indexOf('(') > 0 && msg.name.lastIndexOf(')') > msg.name.indexOf('(')">
                          <span class="msg-tag realname">✅ {{ msg.name.slice(0, msg.name.indexOf('(')) }}</span>
                          <span class="msg-tag community">
                            🏛️ {{ msg.name.slice(msg.name.indexOf('(')+1, msg.name.lastIndexOf(')')) }}
                          </span>
                        </template>
                        <template v-else>
                          <span class="msg-tag realname">✅ {{ msg.name }}</span>
                        </template>
                        <span class="message-time">{{ msg.created_at }}</span>
                      </div>
                      <div class="chat-content">{{ msg.content }}</div>
                    </div>
                    <button v-if="isAdmin" class="message-delete" @click="deleteMessage(msg)" title="删除留言">
                      🗑️
                    </button>
                  </div>
                </div>
                <!-- V4: 游客模式下隐藏发言输入区，仅提示 -->
                <template v-if="!isGuestMode">
                <!-- 发言身份指示 -->
                <div v-if="studentSession && studentSession.student" style="padding:10px 12px;margin:4px 0 10px 0;background:#ECFDF5;border:1px dashed #6EE7B7;border-radius:8px;font-size:13px;color:#065F46;line-height:1.8;">
                  <div style="font-weight:700;">✅ 已验证为【{{ studentSession.student.nickname }}】</div>
                  <div v-if="myCommunity" style="margin-top:2px;">🏛️ 当前社区：{{ myCommunity.name }}（{{ isMyCommunityOwner ? '社长' : '成员' }}），留言将显示为：<b>{{ studentSession.student.nickname }}({{ myCommunity.name }})</b></div>
                  <div v-else style="margin-top:2px;">🎯 暂未加入社区，留言将显示为：<b>{{ studentSession.student.nickname }}</b>（仅实名）</div>
                </div>
                <div v-else style="padding:10px 12px;margin:4px 0 10px 0;background:#F3F4F6;border:1px dashed #D1D5DB;border-radius:8px;font-size:13px;color:#4B5563;line-height:1.8;">
                  <div style="font-weight:600;">🎭 当前为匿名模式</div>
                  <div style="margin-top:2px;">点右上角「🎓 同学登录」并输入正确姓名+密码，即可实名制发言（加入社区后还会带上社区名称）。</div>
                </div>
                <div class="message-input-wrap">
                  <div class="chat-sender-row" :style="{ display: (studentSession && studentSession.student) ? 'none' : 'flex' }">
                    <input
                      v-model="speakerName"
                      type="text"
                      class="chat-name-input"
                      placeholder="👤 你的昵称（未登录时留空=匿名校友）"
                      maxlength="12"
                    />
                  </div>
                  <textarea
                    v-model="newMessage"
                    class="message-input chat-input"
                    placeholder="说点什么吧，Ctrl+Enter 一键发送~"
                    maxlength="200"
                    @keyup.ctrl.enter="sendMessage"
                  ></textarea>
                  <div class="message-input-footer">
                    <span class="char-count">{{ newMessage.length }}/200</span>
                    <button class="btn btn-sm btn-primary" @click="sendMessage" :disabled="!newMessage.trim() || sendingMsg">
                      {{ sendingMsg ? '发送中…' : '🚀 发送' }}
                    </button>
                  </div>
                </div>
                </template>
                <!-- V4: 游客模式提示 -->
                <div v-else style="padding:32px 20px;margin:12px 0;text-align:center;background:#f0ecff;border:2px dashed #c4b5fd;border-radius:12px;color:#6d28d9;">
                  <div style="font-size:36px;margin-bottom:8px;">🔒</div>
                  <div style="font-weight:700;font-size:16px;margin-bottom:6px;">游客模式 · 不能留言</div>
                  <div style="font-size:13px;line-height:1.9;">
                    如需发言或申请创建 / 加入社区，<br>
                    请点顶部「👀 游客模式 · 🔙 返回入口」回到入口页，<br>
                    选择「用户入口」后用姓名+密码登录即可。
                  </div>
                </div>
              </div>

              <!-- 小贴士卡片：图例+使用说明 合并在最底部 -->
              <div class="info-card tips-card">
                <div class="info-card-title calligraphy">💡 小贴士</div>
                <div style="display:flex;flex-direction:column;gap:14px;">
                  <div>
                    <div style="font-weight:600;margin-bottom:8px;color:#8B4513;">🎨 地图图例</div>
                    <div style="display:flex;flex-direction:column;gap:8px;font-size:13px;">
                      <div style="display:flex;align-items:center;gap:10px;">
                        <span style="width:14px;height:14px;border-radius:50%;background:#C0392B;box-shadow:0 0 8px rgba(192,57,43,0.5);"></span>
                        <span>🍜 正在找饭搭子</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:10px;">
                        <span style="width:14px;height:14px;border-radius:50%;background:#8B4513;box-shadow:0 0 8px rgba(139,69,19,0.3);"></span>
                        <span>👤 已就位同学</span>
                      </div>
                    </div>
                  </div>
                  <div>
                    <div style="font-weight:600;margin-bottom:8px;color:#8B4513;">🏷️ 聊天标签说明</div>
                    <div style="display:flex;flex-direction:column;gap:8px;font-size:13px;">
                      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                        <span class="msg-tag realname" style="display:inline-flex;">✅ 实名</span>
                        <span>密码+姓名验证通过</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                        <span class="msg-tag community" style="display:inline-flex;">🏛️ 社区名</span>
                        <span>该同学所在社区</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                        <span class="msg-tag anonymous" style="display:inline-flex;">🎭 匿名校友</span>
                        <span>未登录或未通过验证</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                        <span class="msg-tag community-owner" style="display:inline-flex;">👑 社长</span>
                        <span>社区创建者（可转让）</span>
                      </div>
                    </div>
                  </div>
                  <div>
                    <div style="font-weight:600;margin-bottom:8px;color:#8B4513;">📖 操作指南</div>
                    <div style="font-size:13px;color:#666;line-height:1.9;">
                      <p>• 鼠标悬停地图圆点看同学信息</p>
                      <p>• 点击左侧姓名定位并高亮</p>
                      <p>• 滚轮缩放 / 拖拽移动地图</p>
                      <p>• 点顶部「🎓 同学登录」→ 实名制发言 + 创建/加入社区</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 管理员登录弹窗 -->
          <transition name="modal">
            <div v-if="showLogin" class="modal-mask" @click.self="showLogin = false">
              <div class="modal-content" :class="{ shake: pwdShake }">
                <div class="modal-title calligraphy">🔐 管理员登录</div>
                <div class="form-group">
                  <label>管理员密码</label>
                  <input
                    ref="pwdInput"
                    type="password"
                    v-model="password"
                    placeholder="请输入管理员密码"
                    @keyup.enter="doLogin"
                    @input="pwdError = false; pwdShake = false"
                  >
                </div>
                <div v-if="pwdError" class="password-error">❌ 密码错误，请重试</div>
                <div class="form-actions">
                  <button class="btn btn-secondary" @click="showLogin = false">取消</button>
                  <button class="btn btn-primary" @click="doLogin">登录</button>
                </div>
              </div>
            </div>
          </transition>

          <!-- 学生详情弹窗 -->
          <transition name="modal">
            <div v-if="showDetail && selectedStudent" class="modal-mask" @click.self="showDetail = false">
              <div class="modal-content" style="max-width:420px;">
                <div class="modal-title calligraphy">
                  <span
                    class="detail-student-name"
                    :class="{
                      'name-crimson': (parseInt(selectedStudent.titleLevel) || 0) === 4,
                      'name-sky': (parseInt(selectedStudent.titleLevel) || 0) === 5
                    }"
                  >🧑 {{ displayNameOf(selectedStudent) }}</span> 的档案
                  <span v-if="selectedStudent.looking_for_food" class="status-badge status-approved" style="margin-left:8px;font-size:12px;">🍜 找饭搭子</span>
                </div>
                <div style="padding:8px 0 20px 0;font-size:14px;line-height:2.2;">
                  <!-- 头衔大徽章（最显眼位置，按色号变色） -->
                  <div v-if="selectedStudent.title" style="margin-bottom:16px;">
                    <div class="title-detail-badge" :class="{
                      'badge-gold': (parseInt(selectedStudent.titleLevel) || 0) === 1,
                      'badge-silver': (parseInt(selectedStudent.titleLevel) || 0) === 2,
                      'badge-bronze': (parseInt(selectedStudent.titleLevel) || 0) === 3,
                      'badge-crimson': (parseInt(selectedStudent.titleLevel) || 0) === 4,
                      'badge-sky': (parseInt(selectedStudent.titleLevel) || 0) === 5,
                      'badge-normal': !(parseInt(selectedStudent.titleLevel) > 0)
                    }">
                      🏅 {{ selectedStudent.title }}
                    </div>
                  </div>
                  <div style="display:flex;padding:8px 0;border-bottom:1px dashed #eee;">
                    <span style="width:90px;color:#888;flex-shrink:0;">📍 所在地</span>
                    <span style="color:#2C2C2C;">{{ selectedStudent.province }} · {{ selectedStudent.city }}</span>
                  </div>
                  <div style="display:flex;padding:8px 0;border-bottom:1px dashed #eee;">
                    <span style="width:90px;color:#888;flex-shrink:0;">🏫 大学</span>
                    <span style="color:#2C2C2C;">{{ selectedStudent.university }}</span>
                  </div>
                  <div v-if="selectedStudent.major" style="display:flex;padding:8px 0;border-bottom:1px dashed #eee;">
                    <span style="width:90px;color:#888;flex-shrink:0;">📚 专业</span>
                    <span style="color:#2C2C2C;">{{ selectedStudent.major }}</span>
                  </div>
                  <div v-if="selectedStudent.hobbies && selectedStudent.hobbies.length" style="display:flex;padding:8px 0;border-bottom:1px dashed #eee;">
                    <span style="width:90px;color:#888;flex-shrink:0;">🎯 兴趣爱好</span>
                    <span style="color:#2C2C2C;">{{ selectedStudent.hobbies.join('、') }}</span>
                  </div>
                  <div v-if="selectedStudent.wechat || selectedStudent.qq" style="padding:8px 0;">
                    <div style="color:#888;margin-bottom:6px;">💬 联系方式</div>
                    <div v-if="selectedStudent.wechat" style="padding:6px 12px;background:#ECFDF5;border-radius:6px;margin:4px 0;">
                      <span style="color:#065F46;font-weight:500;">微信：</span>
                      <span style="color:#065F46;user-select:all;">{{ selectedStudent.wechat }}</span>
                    </div>
                    <div v-if="selectedStudent.qq" style="padding:6px 12px;background:#EFF6FF;border-radius:6px;margin:4px 0;">
                      <span style="color:#1E40AF;font-weight:500;">QQ：</span>
                      <span style="color:#1E40AF;user-select:all;">{{ selectedStudent.qq }}</span>
                    </div>
                  </div>
                  <div v-if="!selectedStudent.wechat && !selectedStudent.qq" style="padding:12px 0;color:#999;text-align:center;border-top:1px dashed #eee;">
                    该同学暂未填写联系方式
                  </div>
                </div>
                <div class="form-actions">
                  <button class="btn btn-primary" @click="showDetail = false">关闭</button>
                </div>
              </div>
            </div>
          </transition>

          <!-- 申请加入弹窗 -->
          <transition name="modal">
            <div v-if="showApply" class="modal-mask" @click.self="showApply = false">
              <div class="modal-content">
                <div class="modal-title calligraphy">📮 申请加入蹭饭图</div>
                <div class="form-group">
                  <label>姓名 <span style="color:var(--cinnabar)">*</span></label>
                  <input type="text" v-model="applyForm.nickname" placeholder="请输入你的姓名">
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>省份 <span style="color:var(--cinnabar)">*</span></label>
                    <select v-model="applyForm.province">
                      <option value="">请选择</option>
                      <option v-for="p in PROVINCE_LIST" :key="p" :value="p">{{ p }}</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>城市 <span style="color:var(--cinnabar)">*</span></label>
                    <input type="text" v-model="applyForm.city" placeholder="如：北京市">
                  </div>
                </div>
                <div class="form-group">
                  <label>大学 <span style="color:var(--cinnabar)">*</span></label>
                  <input type="text" v-model="applyForm.university" placeholder="请输入你所在的大学">
                </div>
                <div class="form-group">
                  <label>专业</label>
                  <input type="text" v-model="applyForm.major" placeholder="请输入你的专业（选填）">
                </div>
                <div class="form-group">
                  <label>兴趣爱好（逗号分隔）</label>
                  <input type="text" v-model="applyForm.hobbiesText" placeholder="如：篮球,美食,旅行">
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>微信号</label>
                    <input type="text" v-model="applyForm.wechat" placeholder="选填">
                  </div>
                  <div class="form-group">
                    <label>QQ号</label>
                    <input type="text" v-model="applyForm.qq" placeholder="选填">
                  </div>
                </div>
                <div class="form-group">
                  <label>
                    <input type="checkbox" v-model="applyForm.looking_for_food" style="margin-right:6px;accent-color:var(--cinnabar);">
                    🍜 我正在寻找饭搭子
                  </label>
                </div>
                <div class="form-actions">
                  <button class="btn btn-secondary" @click="showApply = false">取消</button>
                  <button class="btn btn-primary" @click="submitApply">提交申请</button>
                </div>
              </div>
            </div>
          </transition>

          <!-- ====== 同学端：登录弹窗 ====== -->
          <transition name="modal">
            <div v-if="showStudentLogin" class="modal-mask" @click.self="showStudentLogin = false">
              <div class="modal-content" style="max-width:400px;">
                <div class="modal-title calligraphy">🎓 同学登录（实名制）</div>
                <div style="padding:6px 0 12px 0;font-size:13px;color:#888;">
                  <p style="margin:4px 0;">✅ 输入正确姓名+密码，即可：</p>
                  <ul style="padding-left:18px;margin:6px 0;line-height:1.8;">
                    <li>留言板实名制发言（自动附带上社区名称）</li>
                    <li>申请创建社区 / 申请加入社区 / 退出社区 / 转让社长</li>
                    <li>私密联系管理员（仅管理员可见）</li>
                  </ul>
                  <p style="margin:6px 0;color:#92400E;">💡 初始密码请联系管理员获取，管理员可查看/重置每位同学密码。</p>
                </div>
                <div class="form-group">
                  <label>同学姓名（与档案一致）</label>
                  <input type="text" v-model="studentLoginForm.name" placeholder="例如：王小明" @keyup.enter="doStudentLogin">
                </div>
                <div class="form-group">
                  <label>专属 6 位数字密码</label>
                  <input type="password" v-model="studentLoginForm.password" placeholder="6 位纯数字" maxlength="10" @keyup.enter="doStudentLogin">
                </div>
                <div v-if="studentLoginError" style="color:#C0002A;font-size:13px;margin-top:6px;text-align:center;">❌ {{ studentLoginError }}</div>
                <div class="form-actions">
                  <button class="btn btn-secondary" @click="showStudentLogin = false">取消</button>
                  <button class="btn btn-primary" @click="doStudentLogin" :disabled="studentLoginLoading">
                    {{ studentLoginLoading ? '登录中...' : '✅ 登录' }}
                  </button>
                </div>
              </div>
            </div>
          </transition>

          <!-- ====== 同学端：申请创建社区 ====== -->
          <transition name="modal">
            <div v-if="showCreateCommunity" class="modal-mask" @click.self="showCreateCommunity = false">
              <div class="modal-content" style="max-width:460px;">
                <div class="modal-title calligraphy">🏛️ 申请创建新社区</div>
                <div style="padding:4px 0 10px 0;font-size:13px;color:#888;">
                  创建者自动成为该社社长（后续可转让给社内其他成员）。申请提交后需管理员审批。
                </div>
                <div class="form-group">
                  <label>社区名称（最多 16 字，不可重名）</label>
                  <input type="text" v-model="createCommForm.name" maxlength="16" placeholder="例如：篮球社 / 考研互助社">
                </div>
                <div class="form-group">
                  <label>社区简介（最多 200 字，选填）</label>
                  <textarea v-model="createCommForm.intro" rows="3" maxlength="200" style="width:100%;padding:10px;border:1px solid var(--paper-dark);border-radius:6px;resize:vertical;" placeholder="一句话介绍社区，让其它同学一眼看懂"></textarea>
                </div>
                <div class="form-group">
                  <label>📱 您的微信号（必填，方便管理员联系您）</label>
                  <input type="text" v-model="createCommForm.wechat" maxlength="50" placeholder="例如：wx_abc123 / 手机号">
                  <div style="font-size:11px;color:#64748B;margin-top:4px;">🔒 仅管理员可见，不会公开显示在社区页</div>
                </div>
                <div class="form-group">
                  <label>🔒 再次验证您的 6 位密码</label>
                  <input type="password" v-model="createCommForm.password" placeholder="提交创建申请需验证您的身份" maxlength="10">
                </div>
                <div v-if="createCommError" style="color:#C0002A;font-size:13px;margin-top:6px;text-align:center;">❌ {{ createCommError }}</div>
                <div v-else-if="createCommSuccess" style="color:#065F46;font-size:13px;margin-top:6px;text-align:center;">✅ 申请已提交，请等待管理员审批！</div>
                <div class="form-actions">
                  <button class="btn btn-secondary" @click="showCreateCommunity = false">取消</button>
                  <button class="btn btn-primary" @click="submitCreateCommunity" :disabled="createCommLoading">
                    {{ createCommLoading ? '提交中...' : '📤 提交创建申请' }}
                  </button>
                </div>
              </div>
            </div>
          </transition>

          <!-- ====== 同学端：申请加入社区 ====== -->
          <transition name="modal">
            <div v-if="showJoinCommunity" class="modal-mask" @click.self="showJoinCommunity = false">
              <div class="modal-content" style="max-width:460px;">
                <div class="modal-title calligraphy">🎯 申请加入社区</div>
                <div v-if="joinCommTarget" style="margin-bottom:10px;padding:10px;background:#EFF6FF;border-radius:8px;border:1px dashed #60A5FA;">
                  <div style="font-size:14px;font-weight:700;color:#1E40AF;">目标社区：{{ joinCommTarget.name }}</div>
                  <div v-if="joinCommTarget.intro" style="font-size:13px;color:#1E40AF;margin-top:4px;">📖 {{ joinCommTarget.intro }}</div>
                  <div style="font-size:12px;color:#64748B;margin-top:4px;">👑 社长：{{ joinCommTarget.ownerName || joinCommTarget.ownerId }} · 现有成员：{{ joinCommTarget.memberCount || 0 }} 人</div>
                </div>
                <div class="form-group">
                  <label>想对社长说的一句话（选填，最多 100 字）</label>
                  <textarea v-model="joinCommForm.note" rows="2" maxlength="100" style="width:100%;padding:8px;border:1px solid var(--paper-dark);border-radius:6px;resize:vertical;" placeholder="例如：我也喜欢打篮球，想加入一起玩"></textarea>
                </div>
                <div class="form-group">
                  <label>📱 您的微信号（必填，方便社长联系您）</label>
                  <input type="text" v-model="joinCommForm.wechat" maxlength="50" placeholder="例如：wx_abc123 / 手机号">
                  <div style="font-size:11px;color:#64748B;margin-top:4px;">🔒 仅该社区社长/管理员可见，不会公开</div>
                </div>
                <div class="form-group">
                  <label>🔒 您的 6 位密码（验证身份）</label>
                  <input type="password" v-model="joinCommForm.password" maxlength="10" placeholder="提交加入申请需验证身份">
                </div>
                <div v-if="joinCommError" style="color:#C0002A;font-size:13px;margin-top:6px;text-align:center;">❌ {{ joinCommError }}</div>
                <div v-else-if="joinCommSuccess" style="color:#065F46;font-size:13px;margin-top:6px;text-align:center;">✅ 申请已提交，请等待社长或管理员审批！</div>
                <div class="form-actions">
                  <button class="btn btn-secondary" @click="showJoinCommunity = false">取消</button>
                  <button class="btn btn-primary" @click="submitJoinCommunity" :disabled="joinCommLoading">
                    {{ joinCommLoading ? '提交中...' : '📤 提交加入申请' }}
                  </button>
                </div>
              </div>
            </div>
          </transition>

          <!-- ====== 同学端：单聊管理员 ====== -->
          <transition name="modal">
            <div v-if="showDirectChat" class="modal-mask" @click.self="onCloseDirectChat">
              <div class="modal-content" style="max-width:520px;width:96vw;">
                <div class="modal-title calligraphy" style="display:flex;justify-content:space-between;align-items:center;">
                  <span>💌 私信管理员（仅管理员可见）</span>
                  <span style="font-size:12px;color:#888;font-weight:normal;">👤 {{ studentSession && studentSession.student ? studentSession.student.nickname : '' }}</span>
                </div>
                <!-- 聊天区 -->
                <div class="message-list chat-list" ref="dmListRef" style="max-height:320px;margin-bottom:10px;background:#FFFDF8;border-radius:8px;padding:10px 12px;border:1px dashed #F5C842;">
                  <div v-if="directMineMessages.length === 0" style="text-align:center;padding:30px 0;color:#999;font-size:13px;">
                    还没有对话，说点什么吧~
                  </div>
                  <div
                    v-for="(m, i) in directMineMessages"
                    :key="m.id"
                    class="chat-bubble"
                    :class="m.sender === 'admin' ? 'chat-bubble--left' : 'chat-bubble--right'"
                    :style="{ animationDelay: i*0.015 + 's' }"
                  >
                    <div class="chat-avatar" :class="m.sender === 'admin' ? 'chat-avatar--admin' : 'chat-avatar--me'">
                      {{ m.sender === 'admin' ? '管' : '我' }}
                    </div>
                    <div class="chat-body">
                      <div class="chat-name-row">
                        <span style="font-weight:600;">{{ m.sender === 'admin' ? '管理员' : (studentSession && studentSession.student ? studentSession.student.nickname : '我') }}</span>
                        <span style="color:#999;font-size:11px;margin-left:6px;">{{ m.created_at }}</span>
                      </div>
                      <div class="chat-content">{{ m.content }}</div>
                    </div>
                  </div>
                </div>
                <!-- 发送框 -->
                <div style="display:flex;gap:8px;">
                  <textarea
                    v-model="dmInput"
                    rows="2"
                    maxlength="1000"
                    @keyup.ctrl.enter="sendDirectMsg"
                    placeholder="Ctrl+Enter 快捷发送，最多 1000 字..."
                    style="flex:1;padding:8px 10px;border:1px solid var(--paper-dark);border-radius:6px;resize:vertical;font-family:inherit;"
                  ></textarea>
                  <button class="btn btn-primary" @click="sendDirectMsg" :disabled="dmSending || !dmInput.trim()" style="align-self:flex-end;">
                    {{ dmSending ? '发送中...' : '📤' }}
                  </button>
                </div>
                <div v-if="dmTrimmed > 0" style="font-size:12px;color:#B45309;margin-top:6px;text-align:right;">⚠️ 历史消息已自动清理旧 {{ dmTrimmed }} 条</div>
                <div class="form-actions" style="margin-top:14px;">
                  <button class="btn btn-secondary" @click="onCloseDirectChat">关闭</button>
                </div>
              </div>
            </div>
          </transition>
        </div>
      `,
      setup(props, { emit }) {
        const mapRef = ref(null);
        const mapLoading = ref(true);
        let chartInstance = null;

        const keyword = ref('');
        const showLogin = ref(false);
        const showApply = ref(false);
        const showDetail = ref(false);
        const selectedStudent = ref(null);
        const password = ref('');
        const pwdError = ref(false);
        const pwdShake = ref(false);
        const pwdInput = ref(null);

        // 云端状态展示
        const initError = computed(() => globalInitError.value);
        const statusText = computed(() => {
          const s = cloudStatus.value;
          if (s === 'checking') return '🔄 正在连接云端...';
          if (s === 'cloud') return '☁️ 云端已连接 · 数据实时共享';
          if (s === 'error') return '❌ 云端连接失败';
          return '';
        });
        const statusStyle = computed(() => {
          const s = cloudStatus.value;
          if (s === 'checking') return { background: '#FFF3CD', color: '#856404' };
          if (s === 'cloud') return { background: '#D4EDDA', color: '#155724' };
          if (s === 'error') return { background: '#F8D7DA', color: '#721C24' };
          return {};
        });

        const applyForm = reactive({
          nickname: '', province: '', city: '', university: '',
          major: '', hobbiesText: '', wechat: '', qq: '', looking_for_food: false
        });

        const filteredStudents = computed(() => {
          if (!keyword.value.trim()) return studentsStore.list;
          const kw = keyword.value.trim().toLowerCase();
          return studentsStore.list.filter(s =>
            s.nickname.toLowerCase().includes(kw) ||
            s.university.toLowerCase().includes(kw) ||
            s.province.toLowerCase().includes(kw) ||
            s.major.toLowerCase().includes(kw)
          );
        });

        const groupedByProvince = computed(() => {
          const provMap = {};
          filteredStudents.value.forEach(s => {
            if (!provMap[s.province]) provMap[s.province] = {};
            if (!provMap[s.province][s.university]) provMap[s.province][s.university] = [];
            provMap[s.province][s.university].push(s);
          });
          return Object.keys(provMap).sort().map(pName => ({
            name: pName,
            students: filteredStudents.value.filter(s => s.province === pName),
            universities: Object.keys(provMap[pName]).sort().map(uName => ({
              name: uName,
              students: provMap[pName][uName]
            }))
          }));
        });

        const totalCount = computed(() => studentsStore.list.length);
        const provinceCount = computed(() => new Set(studentsStore.list.map(s => s.province)).size);
        const universityCount = computed(() => new Set(studentsStore.list.map(s => s.university)).size);
        const foodCount = computed(() => studentsStore.list.filter(s => s.looking_for_food).length);

        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        const getSpreadCoords = (center, index, total, spread = 0.8) => {
          if (total === 1) return [center[0], center[1]];
          const angle = index * goldenAngle;
          const radius = spread * Math.sqrt(index) / Math.sqrt(total);
          return [
            center[0] + Math.cos(angle) * radius,
            center[1] + Math.sin(angle) * radius
          ];
        };

        const buildScatterData = () => {
          const provStudents = {};
          studentsStore.list.forEach(s => {
            if (!provStudents[s.province]) provStudents[s.province] = [];
            provStudents[s.province].push(s);
          });
          const result = [];
          Object.keys(provStudents).forEach(prov => {
            const center = PROVINCE_DATA[prov]?.center || [105, 35];
            const list = provStudents[prov];
            list.forEach((s, idx) => {
              const coords = getSpreadCoords(center, idx, list.length, 1.5);
              result.push({
                name: s.nickname,
                value: [...coords, s],
                itemStyle: {
                  color: s.looking_for_food ? '#C0392B' : '#8B4513',
                  borderColor: s.looking_for_food ? '#922B21' : '#5D3A1A',
                  borderWidth: 2,
                  shadowBlur: 10,
                  shadowColor: s.looking_for_food ? 'rgba(192, 57, 43, 0.5)' : 'rgba(139, 69, 19, 0.3)'
                }
              });
            });
          });
          return result;
        };

        const buildChartOption = () => {
          const smallProvinces = ['北京', '天津', '上海', '香港', '澳门', '海南', '台湾', '宁夏'];
          const regions = smallProvinces.map(name => ({
            name,
            itemStyle: { areaColor: '#F5E6D3', borderColor: '#2C2C2C', borderWidth: 1.5 },
            z: 10,
            emphasis: { itemStyle: { areaColor: '#E8D5B7', borderColor: '#C0392B', borderWidth: 2 }, label: { show: true, fontSize: 14, fontWeight: '600', color: '#C0392B' } },
            label: { show: true, fontSize: 11, color: '#2C2C2C', fontFamily: "'Ma Shan Zheng', cursive" }
          }));
          const option = {
            backgroundColor: 'transparent',
            geo: {
              map: 'china',
              roam: true,
              zoom: 1.3,
              center: [104.114129, 37.550339],
              itemStyle: {
                areaColor: '#F5E6D3',
                borderColor: '#2C2C2C',
                borderWidth: 1.5
              },
              emphasis: {
                itemStyle: { areaColor: '#E8D5B7', borderColor: '#C0392B', borderWidth: 2 },
                label: { show: true, fontSize: 14, fontWeight: '600', color: '#C0392B' }
              },
              label: { show: true, fontSize: 11, color: '#2C2C2C', fontFamily: "'Ma Shan Zheng', cursive" },
              regions
            },
            tooltip: {
              trigger: 'item',
              backgroundColor: 'rgba(255, 255, 255, 0.98)',
              borderColor: '#D4C4A8',
              borderWidth: 1,
              borderRadius: 8,
              padding: 14,
              textStyle: { color: '#2C2C2C', fontFamily: "'Noto Serif SC', serif" },
              formatter: (params) => {
                if (params.seriesType === 'scatter' && params.value && params.value[2]) {
                  const s = params.value[2];
                  // V4: 游客模式下，姓名显示拼音首字母
                  const displayName = isGuestMode.value ? toInitials(s.nickname) : s.nickname;
                  const hobbiesHtml = s.hobbies && s.hobbies.length
                    ? `<div style="font-size:12px;color:#999;margin-top:6px;">🎯 ${s.hobbies.join('、')}</div>`
                    : '';
                  const foodBadge = s.looking_for_food
                    ? `<span style="display:inline-block;padding:2px 8px;background:#D5F5E3;color:#1E8449;border-radius:10px;font-size:11px;margin-left:8px;">🍜 找饭搭子</span>`
                    : '';
                  const titleBadge = (() => {
                    if (!s.title) return '';
                    const level = parseInt(s.titleLevel) || 0;
                    let bgStyle = 'background:linear-gradient(135deg,#F5C842,#E67E22);color:#fff;';
                    if (level === 1) bgStyle = 'background:linear-gradient(135deg,#FFD700,#FF8F00);color:#fff;';
                    else if (level === 2) bgStyle = 'background:linear-gradient(135deg,#F5F5F5,#757575);color:#333;';
                    else if (level === 3) bgStyle = 'background:linear-gradient(135deg,#DEB887,#8B4513);color:#fff;';
                    return `<span style="display:inline-block;padding:2px 8px;${bgStyle}border-radius:10px;font-size:11px;margin-left:8px;font-weight:600;">🏅 ${s.title}</span>`;
                  })();
                  // 联系方式（兼容旧数据）
                  const contactHtml = [];
                  if (s.wechat) contactHtml.push(`💬 微信：${s.wechat}`);
                  if (s.qq) contactHtml.push(`🐧 QQ：${s.qq}`);
                  const contactStr = contactHtml.length
                    ? `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #eee;font-size:12px;color:#555;line-height:1.8;">${contactHtml.join('<br>')}</div>`
                    : '';
                  return `
                    <div style="min-width:240px;">
                      <div style="font-size:18px;font-weight:600;margin-bottom:8px;color:#C0392B;">
                        🧑 ${displayName}
                        ${titleBadge}
                        ${foodBadge}
                      </div>
                      <div style="border-top:1px solid #eee;padding-top:10px;font-size:13px;line-height:1.9;">
                        <div>📍 ${s.province} · ${s.city}</div>
                        <div>🏫 ${s.university}</div>
                        ${s.major ? `<div>📚 ${s.major}</div>` : ''}
                        ${hobbiesHtml}
                        ${contactStr}
                      </div>
                    </div>
                  `;
                }
                return `<div style="font-weight:500;font-size:14px;">${params.name}</div>`;
              }
            },
            series: [{
              type: 'scatter',
              coordinateSystem: 'geo',
              data: buildScatterData(),
              symbol: 'circle',
              symbolSize: 14,
              emphasis: {
                scale: true,
                scaleSize: 1.8,
                itemStyle: {
                  shadowBlur: 20,
                  shadowColor: 'rgba(192, 57, 43, 0.6)'
                },
                label: { show: true }
              },
              label: {
                show: false,
                position: 'right',
                formatter: (params) => {
                  const s = params.value[2];
                  return isGuestMode.value ? toInitials(s.nickname) : s.nickname;
                },
                fontSize: 12,
                fontWeight: '500',
                color: '#2C2C2C',
                backgroundColor: 'rgba(255,255,255,0.9)',
                padding: [2, 6],
                borderRadius: 4,
                borderColor: '#D4C4A8',
                borderWidth: 1
              },
              animation: true,
              animationDuration: 800,
              animationEasing: 'cubicOut',
              zlevel: 2
            }]
          };
          return option;
        };

        const initMap = async () => {
          try {
            await nextTick();
            if (!mapRef.value) return;
            if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
            echarts.registerMap('china', CHINA_GEOJSON);
            chartInstance = echarts.init(mapRef.value);
            chartInstance.setOption(buildChartOption());
            setTimeout(() => chartInstance && chartInstance.resize(), 100);
            window.addEventListener('resize', handleResize);
          } catch (e) {
            console.error('地图初始化失败:', e);
          } finally {
            mapLoading.value = false;
          }
        };

        const handleResize = () => { if (chartInstance) chartInstance.resize(); };

        const updateMap = () => {
          if (!chartInstance) return;
          chartInstance.setOption({ series: [{ data: buildScatterData() }] });
        };

        const highlightStudent = (student) => {
          selectedStudent.value = student;
          showDetail.value = true;
          const center = PROVINCE_DATA[student.province]?.center;
          if (chartInstance && center) {
            chartInstance.dispatchAction({ type: 'showTip', seriesIndex: 0, name: student.nickname });
            chartInstance.dispatchAction({ type: 'highlight', seriesIndex: 0, name: student.nickname });
            chartInstance.setOption({ geo: { center, zoom: 2 } });
            setTimeout(() => {
              chartInstance.dispatchAction({ type: 'downplay', seriesIndex: 0 });
            }, 3000);
          }
        };

        watch(() => studentsStore.list.length, () => { updateMap(); }, { deep: true });

        const doLogin = async () => {
          const ok = await DataProvider.adminLogin(password.value);
          if (ok) {
            showLogin.value = false;
            password.value = '';
            emit('navigate', 'admin');
          } else {
            pwdError.value = true;
            pwdShake.value = true;
            password.value = '';
            setTimeout(() => pwdShake.value = false, 500);
            if (pwdInput.value) pwdInput.value.focus();
          }
        };

        const submitApply = async () => {
          if (!applyForm.nickname.trim() || !applyForm.province || !applyForm.city.trim() || !applyForm.university.trim()) {
            alert('请填写所有带 * 的必填项！');
            return;
          }
          const hobbies = applyForm.hobbiesText
            ? applyForm.hobbiesText.split(/[,，、]/).map(h => h.trim()).filter(Boolean)
            : [];
          try {
            await DataProvider.addPending({
              nickname: applyForm.nickname.trim(),
              province: applyForm.province,
              city: applyForm.city.trim(),
              university: applyForm.university.trim(),
              major: applyForm.major.trim(),
              hobbies,
              wechat: applyForm.wechat.trim(),
              qq: applyForm.qq.trim(),
              looking_for_food: applyForm.looking_for_food
            });
            alert('✅ 申请已提交！请等待管理员审核通过。');
            showApply.value = false;
            Object.assign(applyForm, { nickname: '', province: '', city: '', university: '', major: '', hobbiesText: '', wechat: '', qq: '', looking_for_food: false });
          } catch (e) {

                        <div style="display:flex;gap:6px;">
                          <button class="btn btn-sm btn-secondary" @click="doRejectJoin(req)">❌ 拒绝</button>
                          <button class="btn btn-sm btn-primary" @click="doApproveJoin(req)" style="background:linear-gradient(135deg,#10B981,#059669);border-color:#059669;">✅ 通过</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- 转让社长弹窗 -->
          <transition name="modal">
            <div v-if="showTransferModal && transferTarget" class="modal-mask" @click.self="showTransferModal = false">
              <div class="modal-content" style="max-width:440px;">
                <div class="modal-title calligraphy">👑 转让社长</div>
                <div style="padding:4px 0 12px 0;line-height:1.9;color:#374151;">
                  确定要将本社区【{{ community.name }}】的社长身份转让给
                  <b style="color:#B91C1C;">{{ displayNameOf(transferTarget) }}</b> 吗？
                  <br><span style="color:#B45309;font-size:13px;">⚠️ 转让后你将不再是社长，需新社长转让才能复位。</span>
                </div>
                <div class="form-actions">
                  <button class="btn btn-secondary" @click="showTransferModal = false">取消</button>
                  <button class="btn btn-primary" style="background:linear-gradient(135deg,#F59E0B,#D97706);border-color:#B45309;" :disabled="transferLoading" @click="confirmTransfer">
                    {{ transferLoading ? '转让中…' : '确认转让' }}
                  </button>
                </div>
              </div>
            </div>
          </transition>
        </div>

      props: [],
      emits: ['navigate'],
      setup(props, { emit }) {
        // 全局共享的 announcementsStore 拿 pinned banner
        const sharedPinnedBanner = computed(() => (announcementsStore.list || []).find(a => a.pinned) || null);

        // 取当前选中的社区（global currentCommunity ref，从 navigateTo payload 注入）
        const community = computed(() => currentCommunity.value || null);
        const commName = computed(() => (community.value && community.value.name) || '（无此社区）');
        const commIntro = computed(() => community.value ? (community.value.intro || '') : '');

        // 学生列表 + 找成员
        const allStudents = computed(() => studentsStore.list || []);
        const ownerName = computed(() => {
          if (!community.value || !community.value.ownerId) return '';
          const s = allStudents.value.find(x => String(x.id) === String(community.value.ownerId));
          return s ? displayNameOf(s) : String(community.value.ownerId);
        });
        const deputyName = computed(() => {
          if (!community.value || !community.value.deputyId) return '';
          const s = allStudents.value.find(x => String(x.id) === String(community.value.deputyId));
          return s ? displayNameOf(s) : String(community.value.deputyId);
        });
        const memberList = computed(() => {
          if (!community.value || !Array.isArray(community.value.memberIds)) return [];
          const ids = community.value.memberIds.map(String);
          const members = allStudents.value.filter(s => ids.includes(String(s.id)));
          // 排序：社长 first → 副社长 → 其他按加入顺序（id 升序）
          return members.slice().sort((a, b) => {
            const ao = String(a.id) === String(community.value.ownerId) ? 0 : (String(a.id) === String(community.value.deputyId) ? 1 : 2);
            const bo = String(b.id) === String(community.value.ownerId) ? 0 : (String(b.id) === String(community.value.deputyId) ? 1 : 2);
            if (ao !== bo) return ao - bo;
            return (a.id || 0) - (b.id || 0);
          });
        });

        // 身份判断
        const isLoggedIn = computed(() => !!(DataProvider.studentSession && DataProvider.studentSession.student));
        const meId = computed(() => {
          const s = DataProvider.studentSession;
          return s && s.student ? String(s.student.id) : null;
        });
        const isOwner = computed(() => !!meId.value && !!community.value && String(community.value.ownerId) === meId.value);
        const myRole = computed(() => {
          if (!meId.value || !community.value) return '';
          if (String(community.value.ownerId) === meId.value) return 'owner';
          if (String(community.value.deputyId) === meId.value) return 'deputy';
          return (memberList.value.some(m => String(m.id) === meId.value)) ? 'member' : '';
        });

        // 审批列表：从 communitiesStore.pendingJoinReqs 里筛出本社区的 + pending
        const pendingJoinReqs = computed(() => {
          if (!community.value) return [];
          const cid = String(community.value.id);
          const all = communitiesStore.allJoinReqs || communitiesStore.pendingJoinReqs || [];
          return all.filter(req => String(req.communityId) === cid && (!req.status || req.status === 'pending'));
        });

        // 转让社长 state
        const showTransferModal = ref(false);
        const transferTarget = ref(null);
        const transferLoading = ref(false);

        // 标题颜色 + 头衔样式
        const getNameClass = (s) => {
          const lv = parseInt(s && s.titleLevel) || 0;
          if (lv === 4) return 'name-crimson';
          if (lv === 5) return 'name-sky';
          return '';
        };
        const titleBadgeClass = (lv) => {
          const v = parseInt(lv) || 0;
          if (v === 1) return 'badge-gold';
          if (v === 2) return 'badge-silver';
          if (v === 3) return 'badge-bronze';
          if (v === 4) return 'badge-crimson';
          if (v === 5) return 'badge-sky';
          return 'badge-normal';
        };

        // Actions
        const goHome = () => { emit('navigate', 'home'); };
        const exitGuestMode = () => {
          if (!confirm('确定退出游客模式回到入口页？')) return;
          isGuestMode.value = false;
          emit('navigate', 'entry');
        };

        const doSetDeputy = async (m) => {
          if (!m || !isOwner.value) return;
          if (!confirm(`确定将【${displayNameOf(m)}】设为副社长吗？`)) return;
          try {
            await DataProvider.setDeputy(community.value.id, 'set', m.id, { role: 'owner' });
            showSuccessModal('🌟 已设置副社长', `【${displayNameOf(m)}】已成为本社区副社长 ✨`);
          } catch (e) {
            alert('❌ 设置副社长失败：' + e.message);
          }
        };
        const doClearDeputy = async () => {
          if (!isOwner.value) return;
          if (!confirm(`确定撤销当前副社长的职务吗？`)) return;
          try {
            await DataProvider.setDeputy(community.value.id, 'clear', null, { role: 'owner' });
            showSuccessModal('🌟 副社长已撤销', `副社长职务已解除`);
          } catch (e) {
            alert('❌ 撤销失败：' + e.message);
          }
        };
        const doTransfer = async (m) => {
          if (!m || !isOwner.value) return;
          transferTarget.value = m;
          showTransferModal.value = true;
        };
        const confirmTransfer = async () => {
          if (!transferTarget.value) return;
          transferLoading.value = true;
          try {
            await DataProvider.transferCommunityOwner(community.value.id, transferTarget.value.id, { role: 'owner' });
            showSuccessModal('👑 社长已转让', `已正式将社长移交给【${displayNameOf(transferTarget.value)}】`);
            showTransferModal.value = false;
          } catch (e) {
            alert('❌ 转让失败：' + e.message);
          } finally { transferLoading.value = false; }
        };
        const doApproveJoin = async (req) => {
          if (!req || !isOwner.value) return;
          if (!confirm(`通过【${req.studentName}】的加入申请吗？`)) return;
          try {
            await DataProvider.approveCommunityJoin(req.id);
            showSuccessModal('✅ 加入申请通过', `已欢迎【${req.studentName}】加入本社区 🎉`);
            await DataProvider.loadCommunityRequests();
          } catch (e) {
            alert('❌ 审批失败：' + e.message);
          }
        };
        const doRejectJoin = async (req) => {
          if (!req || !isOwner.value) return;
          if (!confirm(`拒绝【${req.studentName}】的加入申请吗？`)) return;
          try {
            await DataProvider.rejectCommunityJoin(req.id);
            showSuccessModal('❌ 已拒绝', `已拒绝【${req.studentName}】的加入申请`);
            await DataProvider.loadCommunityRequests();
          } catch (e) {
            alert('❌ 拒绝失败：' + e.message);
          }
        };

        return {
          // state
          community, commName, commIntro,
          memberList, ownerName, deputyName,
          isGuestMode, toInitials, displayNameOf,
          isLoggedIn, myRole, isOwner,
          pendingJoinReqs,
          showTransferModal, transferTarget, transferLoading,
          sharedPinnedBanner,
          // actions
          goHome, exitGuestMode,
          getNameClass, titleBadgeClass,
          doSetDeputy, doClearDeputy,
          doTransfer, confirmTransfer,
          doApproveJoin, doRejectJoin,
        };
      },
    };

      setup(props, { emit }) {
        const tabs = [
          { key: 'pending', label: '待审核' },

          { key: 'food', label: '找饭搭子' },
          { key: 'password', label: '🔑 密码管理' },
          { key: 'community-create', label: '🏛️ 创建社审批' },
          { key: 'community-join', label: '🎯 加入社审批' },
          { key: 'community-manage', label: '🏘️ 社区管理' },
          { key: 'direct-messages', label: '💌 单聊收件箱' },
          { key: 'announcement', label: '公告管理' }
        ];
        const activeTab = ref('pending');
        const showModal = ref(false);
        const isEdit = ref(false);
        const editId = ref(null);
        const showAnnounceForm = ref(false);
        const isEditAnnouncement = ref(false);
        const editAnnouncementId = ref(null);
        // ========= 密码管理 Tab =========
        const pwdKeyword = ref('');
        const filteredStudentsWithPwd = computed(() => {
          const kw = pwdKeyword.value.trim();
          let list = studentsStore.list || [];
          if (kw) list = list.filter(s => (s.nickname || '').includes(kw) || (s.university || '').includes(kw));
          return list.map(s => ({
            ...s,
            hasPassword: !!(s.password && String(s.password).length >= 4)
          }));
        });
        const pwdStats = computed(() => {
          const all = studentsStore.list || [];
          const withPwd = all.filter(s => !!(s.password && String(s.password).length >= 4)).length;
          return { total: all.length, withPwd, missing: all.length - withPwd };
        });
        const revealPwd = reactive({}); // id -> true 表示显示明文
        const toggleRevealPwd = (id) => { revealPwd[id] = !revealPwd[id]; };
        const resetOnePwd = async (s) => {
          if (!confirm(`确定重置【${s.nickname}】的密码为新的 6 位随机数吗？`)) return;
          try {

                  </template>
                  <template v-else-if="isGuestMode">
                    <div style="font-weight:700;color:#6d28d9;margin-bottom:6px;">👀 当前为游客模式</div>
                    <div style="font-size:13px;color:#6d28d9;">仅可查看榜单与姓名首字母缩写（如 whc）。登录后可投票～</div>
                  </template>
                  <template v-else>
                    <div style="font-weight:700;color:#78350F;margin-bottom:6px;">🎓 登录后即可为社区同学投票</div>
                    <div style="font-size:13px;color:#92400E;">请回首页「🎓 同学登录」，登录后即可使用你每天的 3 票权利。</div>
                  </template>
                </div>
              </div>
            </div>

            <!-- 空状态：无数据 -->
            <div v-if="!loading && rank.length === 0" class="info-card" style="padding:50px 20px;text-align:center;">
              <div style="font-size:60px;margin-bottom:10px;">🏆</div>
              <div style="font-size:18px;color:#78350F;margin-bottom:10px;">还没有同学获得投票</div>
              <div style="font-size:13px;color:#92400E;line-height:1.9;margin-bottom:16px;">
                成为第一个给社区同学投票的人吧！<br>
                仅已加入社区的同学互投，未入社不参与榜单。
              </div>
              <button v-if="isLoggedIn && myCommunityName" class="btn btn-primary" @click="refreshRank">🔄 刷新看看有没有新票</button>
              <button v-else-if="!isLoggedIn" class="btn btn-primary" @click="goHome">🎓 去首页登录</button>
              <button v-else class="btn btn-secondary" @click="goHome">🏛️ 去社区申请加入</button>
            </div>

            <!-- 榜单主体 -->
            <template v-else>
              <div class="info-card" style="padding:20px 22px;background:linear-gradient(180deg,#FFFFFF,#FFFBEB);border-color:#FDE68A;">
                <div class="info-card-title calligraphy" style="color:#92400E;border-bottom:2px dashed #FCD34D;margin-bottom:18px;">
                  🏆 唐榜榜单 <span class="message-count">{{ rank.length }} 位上榜</span>
                </div>

                <!-- 前三名展示卡片（大卡片，前 3 名 medal） -->
                <div v-if="top3.length > 0" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;" class="tangrank-top3">
                  <div v-for="(t, i) in top3" :key="t.studentId" class="tangrank-top3-card" :style="top3CardStyle(i)">
                    <div class="tangrank-top3-medal">{{ ['🥇','🥈','🥉'][i] || '🎖️' }}</div>
                    <div class="tangrank-top3-name">
                      <span :class="getNameClass(t.student)">
                        {{ displayNameOf(t.student) }}
                      </span>
                    </div>
                    <div style="font-size:12px;color:#78350F;margin-bottom:8px;line-height:1.6;">
                      🏛️ {{ t.communityName }}
                      <template v-if="t.student && t.student.title"><br>🏅 {{ t.student.title }}</template>
                    </div>
                    <div class="tangrank-top3-votes">{{ t.total }} 票</div>
                    <!-- 投票按钮：允许在前 3 卡片上也投 -->
                    <button
                      class="btn btn-sm btn-primary"
                      style="margin-top:10px;background:linear-gradient(135deg,#B91C1C,#991B1B);border-color:#7F1D1D;"
                      :disabled="!canVoteFor(t.studentId)"
                      @click="doVote(t)"
                    >
                      {{ !isLoggedIn ? '登录后投' : (!myCommunityName ? '未入社' : (hasVotedFor(t.studentId) ? '今日已投' : '🗳️ 投一票')) }}
                    </button>
                  </div>
                </div>

                <!-- 4+ 名完整列表 -->
                <div v-if="rank.length > 3" style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
                  <div
                    v-for="row in rank.slice(3)"
                    :key="row.studentId"
                    class="tangrank-row"
                    style="display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;background:#FFFDF7;border:1px solid #FDE68A;"
                  >
                    <div class="tangrank-rank-badge" style="width:40px;text-align:center;font-weight:800;color:#92400E;font-size:18px;">
                      #{{ row.rank }}
                    </div>
                    <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FEF3C7,#FDE68A);display:flex;align-items:center;justify-content:center;font-weight:800;color:#92400E;flex-shrink:0;">
                      {{ displayNameOf(row.student).slice(0,1).toUpperCase() }}
                    </div>
                    <div style="flex:1;min-width:0;">
                      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                        <span class="detail-student-name" style="font-weight:700;font-size:15px;" :class="getNameClass(row.student)">
                          {{ displayNameOf(row.student) }}
                        </span>
                        <span v-if="row.student && row.student.title" class="inline-title-badge" :class="titleBadgeClass(row.student.titleLevel)">{{ row.student.title }}</span>
                        <span class="msg-tag community" style="font-size:11px;">🏛️ {{ row.communityName }}</span>
                      </div>
                      <div v-if="!isGuestMode" style="color:#92400E;font-size:12px;margin-top:3px;line-height:1.6;">
                        📍 {{ row.student ? (row.student.province || '未标注') : '' }}　
                        🏫 {{ row.student ? (row.student.university || '') : '' }}
                      </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
                      <div style="font-weight:800;color:#B91C1C;font-size:18px;text-align:right;">
                        {{ row.total }}<span style="font-size:12px;color:#78350F;margin-left:2px;">票</span>
                      </div>
                      <button
                        class="btn btn-sm btn-primary"
                        style="background:linear-gradient(135deg,#B91C1C,#991B1B);border-color:#7F1D1D;min-width:84px;"
                        :disabled="!canVoteFor(row.studentId)"
                        @click="doVote(row)"
                      >
                        {{ voteBtnText(row.studentId) }}
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
      `,
      props: [],
      emits: ['navigate'],
      setup(props, { emit }) {
        const rank = computed({
          get: () => (tangRankStore.rank || []).map(row => ({
            ...row,
            student: (studentsStore.list || []).find(s => String(s.id) === String(row.studentId)) || null,
          })),
          set: (v) => { tangRankStore.rank = v; }
        });
        const loading = computed(() => !!tangRankStore.loading);
        const myRemaining = computed(() => tangRankStore.myRemaining || 0);
        const myVotedToday = computed(() => tangRankStore.myVotedToday || []);

        const sharedPinnedBanner = computed(() => (announcementsStore.list || []).find(a => a.pinned) || null);
        const isLoggedIn = computed(() => !!(DataProvider.studentSession && DataProvider.studentSession.student));
        const me = computed(() => {
          const s = DataProvider.studentSession;
          return s && s.student ? s.student : null;
        });
        const myCommunityId = computed(() => me.value ? (me.value.communityId || null) : null);
        const myCommunityName = computed(() => {
          if (!myCommunityId.value) return '';
          const c = (DataProvider.communities || []).find(x => String(x.id) === String(myCommunityId.value));
          return c ? c.name : '';
        });

        const top3 = computed(() => rank.value.slice(0, 3));
        const myVotedNames = computed(() => {
          if (!myVotedToday.value.length) return '';
          const students = studentsStore.list || [];
          return myVotedToday.value
            .map(id => {
              const s = students.find(x => String(x.id) === String(id));
              return s ? displayNameOf(s) : ('#' + id);
            })
            .join('、');
        });

        const top3CardStyle = (i) => {
          const gradients = [
            'background:linear-gradient(180deg,#FFF7AE,#FDE68A);border:2px solid #F59E0B;',
            'background:linear-gradient(180deg,#E5E7EB,#D1D5DB);border:2px solid #9CA3AF;',
            'background:linear-gradient(180deg,#FFEDD5,#FED7AA);border:2px solid #F59E0B;',
          ];
          return gradients[i] || '';
        };

        const getNameClass = (s) => {
          const lv = parseInt(s && s.titleLevel) || 0;
          if (lv === 4) return 'name-crimson';
          if (lv === 5) return 'name-sky';
          return '';
        };
        const titleBadgeClass = (lv) => {
          const v = parseInt(lv) || 0;
          if (v === 1) return 'badge-gold';
          if (v === 2) return 'badge-silver';
          if (v === 3) return 'badge-bronze';
          if (v === 4) return 'badge-crimson';
          if (v === 5) return 'badge-sky';
          return 'badge-normal';
        };

        const hasVotedFor = (candidateId) => {
          const key = String(candidateId);
          return (myVotedToday.value || []).some(id => String(id) === key);
        };
        const canVoteFor = (candidateId) => {
          if (!isLoggedIn.value) return false;
          if (!myCommunityId.value) return false;
          if (isGuestMode.value) return false;
          if (myRemaining.value <= 0) return false;
          if (me.value && String(me.value.id) === String(candidateId)) return false;
          return true;
        };
        const voteBtnText = (candidateId) => {
          if (isGuestMode.value) return '🔒 游客';
          if (!isLoggedIn.value) return '登录后投';
          if (!myCommunityId.value) return '未入社';
          if (me.value && String(me.value.id) === String(candidateId)) return '不能投自己';
          if (hasVotedFor(candidateId) && myRemaining.value > 0) return '🗳️ 再投一票';
          if (myRemaining.value <= 0) return '今日 3 票用完';
          return '🗳️ 投一票';
        };

        const refreshRank = async () => {
          tangRankStore.loading = true;
          try {
            const data = await DataProvider.getTangRank();
            tangRankStore.rank = data && data.rank ? data.rank : [];
            tangRankStore.myRemaining = data && typeof data.myRemaining === 'number' ? data.myRemaining : 0;
            tangRankStore.myVotedToday = data && Array.isArray(data.myVotedToday) ? data.myVotedToday : [];
          } catch (e) {
            alert('❌ 拉取唐榜失败：' + e.message);
          } finally {
            tangRankStore.loading = false;
          }
        };
        const doVote = async (row) => {
          if (!row) return;
          const cid = row.studentId;
          const cname = row.student ? displayNameOf(row.student) : ('#' + cid);
          if (!canVoteFor(cid)) return;
          if (!confirm(`确定把你宝贵的一票投给【${cname}】吗？`)) return;
          try {
            tangRankStore.loading = true;
            const r = await DataProvider.voteTang(cid);
            // 刷新榜单
            await refreshRank();
            showSuccessModal('🏆 唐榜投票成功！',
              `成功把 1 票投给了【${cname}】\n剩余票数：${typeof r.remaining === 'number' ? r.remaining : Math.max(0, myRemaining.value - 1)} 票`, 3500);
          } catch (e) {
            alert('❌ 投票失败：' + e.message);
          } finally {
            tangRankStore.loading = false;
          }
        };

        const goHome = () => { emit('navigate', 'home'); };
        const exitGuestMode = () => {
          if (!confirm('确定退出游客模式回到入口页？')) return;
          isGuestMode.value = false;
          emit('navigate', 'entry');
        };

        onMounted(refreshRank);
        watch(() => isGuestMode.value, () => { /* identity change noop */ }, { flush: 'post' });

        return {
          // state
          rank, loading, myRemaining, myVotedToday,
          top3, myVotedNames, sharedPinnedBanner,
          isGuestMode, toInitials, displayNameOf,
          isLoggedIn, me, myCommunityId, myCommunityName,
          // helpers
          getNameClass, titleBadgeClass,
          top3CardStyle, canVoteFor, voteBtnText, hasVotedFor,
          // actions
          goHome, exitGuestMode, refreshRank, doVote
        };
      },
    };

    // ========== 根应用 ==========
    const app = createApp({
      setup() {
        const currentPage = ref('entry');

        const currentPageComponent = computed(() => {
          // V4: 扩展社区独立页 / 唐榜页。未定义时回退到占位页
          const map = {
            entry: EntryPage,
            home: MainPage,
            admin: AdminPage,
            community: (typeof CommunityFullPage !== 'undefined' ? CommunityFullPage : {
              template: `<div style="padding:40px;text-align:center;">社区页面加载中…<br><button class="btn btn-primary" @click="$emit('navigate','home')">回到首页</button></div>`,
              emits: ['navigate']
            }),
            'tang-rank': (typeof TangRankPage !== 'undefined' ? TangRankPage : {
              template: `<div style="padding:40px;text-align:center;">唐榜加载中…<br><button class="btn btn-primary" @click="$emit('navigate','home')">回到首页</button></div>`,
              emits: ['navigate']
            })
          };
          // 管理员页面鉴权
          const isAuthed = DataProvider.isAdmin();
          if (currentPage.value === 'admin' && !isAuthed) return EntryPage;
          return map[currentPage.value] || EntryPage;
        });

        const navigateTo = (page, payload) => {
          // V4: navigateTo('community', payload) 可自动设置当前社区
          if (page === 'community') {
            currentCommunity.value = payload || null;
          } else if (page === 'tang-rank') {
            tangRankStore.loading = true;
          }
          currentPage.value = page;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        return {
          currentPage, currentPageComponent, navigateTo,
          // V4 全局
          successModalState, closeSuccessModal,
          isGuestMode, currentCommunity, tangRankStore,
          toInitials, displayNameOf,
        };
      }
    });

    // ========== 兜底3：Vue 应用级错误捕获（组件 render/setup/computed/watch 内部错误，最容易白屏）==========
    app.config.errorHandler = function (err, vm, info) {
      console.error('[Vue errorHandler] info=', info, 'err=', err);
      var stack = (err && err.stack) ? err.stack : String(err || '');
      window.__showFatalError('Vue 组件内部错误 (' + info + ')', stack);
    };
    app.config.warnHandler = function (msg, vm, trace) {
      console.warn('[Vue warnHandler]', msg, trace);
      // 常见警告：模板用了未 return 的变量 (_ctx.xxx is not defined) —— 这些会导致白屏
      if (/_ctx\.\w+ is not defined|Property "\w+" was accessed during render/i.test(String(msg || ''))) {
        window.__showFatalError('Vue 模板变量未定义（setup 漏 return）', msg + '\n组件位置：' + (trace || ''));
      }
    };

    app.mount('#app');
  </script>
</body>
</html>
