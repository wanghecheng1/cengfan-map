<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高中同学全国蹭饭图</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cinnabar: #C0392B;
      --cinnabar-dark: #922B21;
      --ink: #2C2C2C;
      --ink-light: #555;
      --paper: #FDF8F0;
      --paper-warm: #F5E6D3;
      --paper-deep: #E8D5B7;
      --paper-dark: #D4C4A8;
      --jade: #27AE60;
      --gold: #B8860B;
      --text-muted: #888;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.12);
      --radius-sm: 6px;
      --radius-md: 12px;
    }

    body {
      font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      background-image:
        url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23D4C4A8' fill-opacity='0.15' fill-rule='evenodd'/%3E%3C/svg%3E");
    }

    .calligraphy { font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', cursive; }
    .xiaowei { font-family: 'ZCOOL XiaoWei', 'STSong', serif; }
    .serif { font-family: 'Noto Serif SC', 'STSong', serif; }

    #app { min-height: 100vh; }

    /* 页面过渡 */
    .page-enter-active, .page-leave-active {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: absolute;
      width: 100%;
    }
    .page-enter-from { opacity: 0; transform: translateY(20px); }
    .page-leave-to { opacity: 0; transform: translateY(-20px); }

    /* 弹窗过渡 */
    .modal-enter-active, .modal-leave-active { transition: all 0.3s ease; }
    .modal-enter-from, .modal-leave-to { opacity: 0; }
    .modal-enter-from .modal-content,
    .modal-leave-to .modal-content {
      transform: scale(0.92) translateY(20px);
      opacity: 0;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeInUp 0.5s ease backwards; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--paper-dark);
      border-top-color: var(--cinnabar);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease; }

    /* 按钮 */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 18px;
      border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.25s ease;
      border: none; font-family: inherit;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--cinnabar) 0%, var(--cinnabar-dark) 100%);
      color: #fff;
      box-shadow: 0 3px 10px rgba(192, 57, 43, 0.3);
    }
    .btn-primary:hover { box-shadow: 0 5px 15px rgba(192, 57, 43, 0.4); }
    .btn-secondary {
      background: #fff; color: var(--ink);
      border: 2px solid var(--paper-dark);
    }
    .btn-secondary:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
    .btn-jade {
      background: linear-gradient(135deg, var(--jade) 0%, #1E8449 100%);
      color: #fff;
    }
    .btn-danger {
      background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
      color: #fff;
    }
    .btn-sm { padding: 5px 12px; font-size: 12px; }

    /* ========== 入口选择页面 ========== */
    .entry-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FDF2E9 0%, #F5E6D3 50%, #FAE5D3 100%);
      position: relative;
      overflow: hidden;
    }
    .entry-page::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background-image: radial-gradient(circle, rgba(192, 57, 43, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      animation: floatBg 20s linear infinite;
    }
    @keyframes floatBg {
      from { transform: translate(0, 0); }
      to { transform: translate(30px, 30px); }
    }
    .entry-content {
      text-align: center;
      padding: 60px 40px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(139, 69, 19, 0.15);
      border: 2px solid var(--paper-dark);
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
      animation: fadeInUp 0.8s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .entry-logo {
      font-size: 80px;
      margin-bottom: 20px;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .entry-title {
      font-size: 42px;
      color: var(--cinnabar);
      margin-bottom: 10px;
      letter-spacing: 4px;
    }
    .entry-subtitle {
      font-size: 18px;
      color: #8B4513;
      margin-bottom: 40px;
      opacity: 0.8;
    }
    .entry-buttons {
      display: flex;
      gap: 30px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .entry-btn {
      width: 200px;
      padding: 30px 20px;
      border: 2px solid var(--paper-dark);
      border-radius: 16px;
      background: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .entry-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(139, 69, 19, 0.2);
    }
    .entry-btn-user:hover {
      border-color: var(--cinnabar);
      background: #FDF2E9;
    }
    .entry-btn-admin:hover {
      border-color: #8B4513;
      background: #F5E6D3;
    }
    .entry-icon {
      font-size: 48px;
    }
    .entry-btn-title {
      font-size: 20px;
      font-weight: 600;
      color: #2C2C2C;
      font-family: "'Noto Serif SC', serif";
    }
    .entry-btn-desc {
      font-size: 13px;
      color: #999;
    }
    .entry-footer {
      font-size: 14px;
      color: #B7950B;
      letter-spacing: 6px;
      opacity: 0.7;
    }

    /* ========== 主页面布局 ========== */
    .main-page {
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* 顶部标题栏 */
    .top-bar {
      background: linear-gradient(180deg, rgba(245,230,211,0.9) 0%, rgba(245,230,211,0.6) 100%);
      border-bottom: 2px solid var(--paper-dark);
      padding: 18px 30px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(8px);
    }
    .top-title {
      font-size: 30px; font-weight: 700;
      color: var(--cinnabar);
      letter-spacing: 6px;
      text-shadow: 2px 2px 0 rgba(212, 172, 13, 0.2);
    }
    .top-subtitle {
      font-size: 14px; color: var(--text-muted);
      letter-spacing: 2px; margin-top: 4px;
    }
    .top-actions { display: flex; gap: 10px; }

    /* 主体内容 */
    .main-content {
      flex: 1;
      display: flex;
      padding: 20px;
      gap: 20px;
    }

    /* 左侧名单 */
    .left-panel {
      width: 340px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid var(--paper-dark);
      border-radius: var(--radius-md);
      padding: 20px;
      overflow-y: auto;
      max-height: calc(100vh - 120px);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
    }

    .panel-title {
      font-size: 20px; font-weight: 600;
      color: var(--cinnabar);
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--paper-dark);
      display: flex; align-items: center; gap: 8px;
    }

    .province-section {
      margin-bottom: 20px;
    }
    .province-name {
      font-size: 18px; font-weight: 600;
      color: var(--cinnabar);
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .province-name::before {
      content: '◆';
      font-size: 12px;
      color: var(--gold);
    }
    .province-count {
      font-size: 12px; font-weight: normal;
      color: var(--text-muted);
      margin-left: 8px;
    }

    .university-group {
      margin-bottom: 10px;
      padding-left: 16px;
    }
    .university-name {
      font-size: 14px;
      color: var(--ink-light);
      font-weight: 500;
      margin-bottom: 6px;
    }
    .university-count {
      font-size: 11px;
      color: var(--cinnabar);
      margin-left: 6px;
    }

    .students-list {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding-left: 12px;
    }
    .student-name {
      font-size: 13px;
      padding: 2px 8px;
      background: var(--paper-warm);
      border-radius: 4px;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .student-name:hover {
      background: var(--cinnabar);
      color: #fff;
      border-color: var(--cinnabar);
    }

    /* 中间地图 */
    .map-panel {
      flex: 1;
      position: relative;
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid var(--paper-dark);
      border-radius: var(--radius-md);
      overflow: hidden;
      min-height: 600px;
      box-shadow: var(--shadow-sm);
    }
    .map-container {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 160px);
    }
    .map-loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(253, 248, 240, 0.9);
      z-index: 10;
    }
    .map-empty {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-muted);
      pointer-events: none;
    }
    .map-empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.4; }
    .map-empty-title { font-size: 18px; color: var(--ink-light); margin-bottom: 8px; }

    /* 右侧信息卡 */
    .right-panel {
      width: 300px;
      flex-shrink: 0;
      display: flex; flex-direction: column;
      gap: 20px;
    }
    .info-card {
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid var(--paper-dark);
      border-radius: var(--radius-md);
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
    }
    .info-card-title {
      font-size: 16px; font-weight: 600;
      color: var(--cinnabar);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--paper-dark);
    }
    .stat-item {
      display: flex; justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed var(--paper-dark);
    }
    .stat-item:last-child { border-bottom: none; }
    .stat-label { color: var(--text-muted); font-size: 13px; }
    .stat-value { font-weight: 600; color: var(--cinnabar); font-size: 16px; }

    /* 留言板 */
    .message-card {
      display: flex;
      flex-direction: column;
    }
    .message-count {
      font-size: 12px;
      font-weight: normal;
      color: #999;
      margin-left: 8px;
    }
    .message-list {
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 12px;
      padding-right: 4px;
    }
    .message-list::-webkit-scrollbar {
      width: 6px;
    }
    .message-list::-webkit-scrollbar-thumb {
      background: var(--paper-dark);
      border-radius: 3px;
    }
    .message-item {
      padding: 10px 0;
      border-bottom: 1px dashed var(--paper-dark);
    }
    .message-item:last-child { border-bottom: none; }
    .message-content {
      font-size: 13px;
      color: #333;
      line-height: 1.6;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .message-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .message-time {
      font-size: 11px;
      color: #999;
    }
    .message-delete {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      opacity: 0.6;
      transition: opacity 0.2s;
      padding: 2px 4px;
    }
    .message-delete:hover { opacity: 1; }
    .message-input-wrap {
      border-top: 1px solid var(--paper-dark);
      padding-top: 12px;
    }
    .message-input {
      width: 100%;
      min-height: 60px;
      border: 1px solid var(--paper-dark);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      background: rgba(255, 255, 255, 0.8);
      box-sizing: border-box;
    }
    .message-input:focus {
      outline: none;
      border-color: var(--cinnabar);
    }
    .message-input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .char-count {
      font-size: 11px;
      color: #999;
    }

    /* 搜索框 */
    .search-box {
      margin-bottom: 16px;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--paper-dark);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--cinnabar);
      box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.1);
    }

    /* 弹窗 */
    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      background: #fff;
      border-radius: var(--radius-md);
      padding: 32px;
      width: 520px;
      max-width: 92vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }
    .modal-title {
      font-size: 22px; font-weight: 600;
      text-align: center;
      margin-bottom: 28px;
      color: var(--cinnabar);
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 14px;
      color: var(--ink-light);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--paper-dark);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--cinnabar);
      box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.1);
    }
    .form-row {
      display: flex; gap: 12px;
    }
    .form-row .form-group { flex: 1; }
    .form-actions {
      display: flex; justify-content: flex-end; gap: 10px;
      margin-top: 24px;
    }
    .password-error {
      color: var(--cinnabar);
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }

    /* 管理员页面 */
    .admin-page {
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .admin-header {
      background: linear-gradient(135deg, #2C2C2C 0%, #444 100%);
      color: #fff;
      padding: 16px 30px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .admin-title { font-size: 22px; letter-spacing: 3px; }
    .admin-content {
      flex: 1;
      padding: 24px 30px;
    }
    .admin-tabs {
      display: flex; gap: 10px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--paper-dark);
      padding-bottom: 12px;
    }
    .admin-tab {
      padding: 10px 24px;
      background: #fff;
      border: 2px solid var(--paper-dark);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .admin-tab:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
    .admin-tab.active {
      background: var(--cinnabar);
      color: #fff;
      border-color: var(--cinnabar);
    }
    .tab-badge {
      display: inline-block;
      min-width: 20px;
      height: 20px;
      line-height: 20px;
      text-align: center;
      background: #E74C3C;
      color: #fff;
      font-size: 12px;
      border-radius: 10px;
      padding: 0 6px;
      margin-left: 6px;
      font-weight: 600;
    }
    .admin-tab.active .tab-badge {
      background: #fff;
      color: var(--cinnabar);
    }

    .student-table {
      width: 100%;
      background: #fff;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 2px solid var(--paper-dark);
    }
    .table-header {
      display: flex;
      background: var(--paper-warm);
      padding: 12px 16px;
      font-weight: 600;
      border-bottom: 2px solid var(--paper-dark);
    }
    .table-row {
      display: flex;
      padding: 12px 16px;
      border-bottom: 1px solid var(--paper-dark);
      align-items: center;
      transition: background 0.2s ease;
    }
    .table-row:hover { background: var(--paper-warm); }
    .table-row:last-child { border-bottom: none; }
    .col-name { flex: 1.2; }
    .col-province { flex: 1; }
    .col-school { flex: 1.5; }
    .col-major { flex: 1.2; }
    .col-status { flex: 0.8; }
    .col-actions { flex: 1; text-align: right; }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-approved { background: #D5F5E3; color: #1E8449; }
    .status-pending { background: #FCF3CF; color: #B7950B; }

    .add-btn-wrap {
      margin-bottom: 16px;
      display: flex; justify-content: flex-end;
    }

    /* 印章效果 */
    .stamp {
      display: inline-block;
      padding: 4px 12px;
      border: 2px solid var(--cinnabar);
      color: var(--cinnabar);
      border-radius: 4px;
      font-size: 12px;
      transform: rotate(-5deg);
      font-weight: 600;
      opacity: 0.8;
    }

    /* 响应式 */
    @media (max-width: 1200px) {

      _useCloud: null,

      async _isCloudAvailable() {
        if (this._useCloud !== null) return this._useCloud;
        try {
          // 用 GET 实际请求检测，而不是 OPTIONS（OPTIONS 在配置错误时也会返回 200）
          const res = await fetch('/api/messages');
          if (res.ok) {
            const data = await res.json();
            // 确认返回的是有效数组数据
            this._useCloud = Array.isArray(data);
          } else {
            this._useCloud = false;
          }
        } catch (e) {
          this._useCloud = false;
        }
        console.log('[DataProvider] 云端检测结果:', this._useCloud);
        return this._useCloud;
      },

      _getHeaders(needAuth = false) {
        const headers = { 'Content-Type': 'application/json' };
        if (needAuth && adminToken) {
          headers['X-Admin-Token'] = adminToken;
        }
        return headers;
      },

      // 云端操作失败时，标记为不可用，后续全部走本地
      _markCloudFailed() {
        this._useCloud = false;
        console.warn('[DataProvider] 云端不可用，已切换为本地模式');
      },

        const cloudOk = await this._isCloudAvailable();

          try {
            const res = await fetch('/api/students');
            if (res.ok) {
              const data = await res.json();
              studentsStore.list = data;
              if (data.length > 0) {
                idCounter = Math.max(...data.map(s => s.id), 0) + 1;
              }
              return data;
            } else {
              this._markCloudFailed();
            }
          } catch (e) {
            console.warn('云端获取学生失败，使用本地:', e);
            this._markCloudFailed();
          }
        }
        const local = localStorage.getItem('cengfan_students');
        if (local) {
          const parsed = JSON.parse(local);
          studentsStore.list = parsed;
          idCounter = Math.max(...parsed.map(s => s.id), 0) + 1;
          return parsed;
        }
        return [];
      },

        const cloudOk = await this._isCloudAvailable();
        const newItem = {
          id: nextId(),
          ...student,
          created_at: new Date().toLocaleDateString('zh-CN')
        };
        if (cloudOk && adminToken) {
          try {
            const res = await fetch('/api/students', {
              method: 'POST',
              headers: this._getHeaders(true),
              body: JSON.stringify(student)
            });
            if (res.ok) {
              const saved = await res.json();
              studentsStore.list.push(saved);
              return saved;
            } else {
              this._markCloudFailed();

          } catch (e) {
            console.warn('云端添加失败，使用本地:', e);

          }

        studentsStore.list.push(newItem);
        localStorage.setItem('cengfan_students', JSON.stringify(studentsStore.list));
        return newItem;
      },

          try {
            const res = await fetch(`/api/students/${id}`, {
              method: 'PUT',
              headers: this._getHeaders(true),
              body: JSON.stringify(updates)
            });
            if (res.ok) {
              const saved = await res.json();
              const idx = studentsStore.list.findIndex(s => s.id == id);
              if (idx > -1) studentsStore.list[idx] = saved;
              return saved;
            } else {
              this._markCloudFailed();
            }
          } catch (e) {
            console.warn('云端更新失败:', e);
            this._markCloudFailed();
          }
        }
        const idx = studentsStore.list.findIndex(s => s.id == id);
        if (idx > -1) {
          studentsStore.list[idx] = { ...studentsStore.list[idx], ...updates };
          localStorage.setItem('cengfan_students', JSON.stringify(studentsStore.list));
        }
        return studentsStore.list[idx];

          <!-- 申请加入弹窗 -->
          <transition name="modal">

              <div class="modal-content">
                <div class="modal-title calligraphy">📮 申请加入蹭饭图</div>
                <div class="form-group">
                  <label>姓名 <span style="color:var(--cinnabar)">*</span></label>
                  <input type="text" v-model="applyForm.nickname" placeholder="请输入你的姓名">
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>省份 <span style="color:var(--cinnabar)">*</span></label>
                    <select v-model="applyForm.province">

                  <div class="form-group">

                  <button class="btn btn-primary" @click="submitApply">提交申请</button>

          </transition>

      `,
      setup(props, { emit }) {
        const mapRef = ref(null);
        const mapLoading = ref(true);
        let chartInstance = null;

        const keyword = ref('');
        const showLogin = ref(false);
        const showApply = ref(false);
        const password = ref('');
        const pwdError = ref(false);
        const pwdShake = ref(false);
        const pwdInput = ref(null);

        const applyForm = reactive({
          nickname: '', province: '', city: '', university: '',
          major: '', hobbiesText: '', wechat: '', qq: '', looking_for_food: false
        });

        const filteredStudents = computed(() => {
          if (!keyword.value.trim()) return studentsStore.list;
          const kw = keyword.value.trim().toLowerCase();
          return studentsStore.list.filter(s =>
            s.nickname.toLowerCase().includes(kw) ||
            s.university.toLowerCase().includes(kw) ||
            s.province.toLowerCase().includes(kw) ||
            s.major.toLowerCase().includes(kw)
          );
        });

        const groupedByProvince = computed(() => {
          const provMap = {};
          filteredStudents.value.forEach(s => {
            if (!provMap[s.province]) provMap[s.province] = {};
            if (!provMap[s.province][s.university]) provMap[s.province][s.university] = [];
            provMap[s.province][s.university].push(s);
          });
          return Object.keys(provMap).sort().map(pName => ({
            name: pName,
            students: filteredStudents.value.filter(s => s.province === pName),
            universities: Object.keys(provMap[pName]).sort().map(uName => ({
              name: uName,
              students: provMap[pName][uName]
            }))
          }));
        });

        const totalCount = computed(() => studentsStore.list.length);
        const provinceCount = computed(() => new Set(studentsStore.list.map(s => s.province)).size);
        const universityCount = computed(() => new Set(studentsStore.list.map(s => s.university)).size);
        const foodCount = computed(() => studentsStore.list.filter(s => s.looking_for_food).length);

        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        const getSpreadCoords = (center, index, total, spread = 0.8) => {
          if (total === 1) return [center[0], center[1]];
          const angle = index * goldenAngle;
          const radius = spread * Math.sqrt(index) / Math.sqrt(total);
          return [
            center[0] + Math.cos(angle) * radius,
            center[1] + Math.sin(angle) * radius
          ];
        };

        const buildScatterData = () => {
          const provStudents = {};
          studentsStore.list.forEach(s => {
            if (!provStudents[s.province]) provStudents[s.province] = [];
            provStudents[s.province].push(s);
          });
          const result = [];
          Object.keys(provStudents).forEach(prov => {
            const center = PROVINCE_DATA[prov]?.center || [105, 35];
            const list = provStudents[prov];
            list.forEach((s, idx) => {
              const coords = getSpreadCoords(center, idx, list.length, 1.5);
              result.push({
                name: s.nickname,
                value: [...coords, s],
                itemStyle: {
                  color: s.looking_for_food ? '#C0392B' : '#8B4513',
                  borderColor: s.looking_for_food ? '#922B21' : '#5D3A1A',
                  borderWidth: 2,
                  shadowBlur: 10,
                  shadowColor: s.looking_for_food ? 'rgba(192, 57, 43, 0.5)' : 'rgba(139, 69, 19, 0.3)'
                }
              });
            });
          });
          return result;
        };

        const buildChartOption = () => {
          const smallProvinces = ['北京', '天津', '上海', '香港', '澳门', '海南', '台湾', '宁夏'];
          const regions = smallProvinces.map(name => ({
            name,
            itemStyle: { areaColor: '#F5E6D3', borderColor: '#2C2C2C', borderWidth: 1.5 },
            z: 10,
            emphasis: { itemStyle: { areaColor: '#E8D5B7', borderColor: '#C0392B', borderWidth: 2 }, label: { show: true, fontSize: 14, fontWeight: '600', color: '#C0392B' } },
            label: { show: true, fontSize: 11, color: '#2C2C2C', fontFamily: "'Ma Shan Zheng', cursive" }
          }));
          const option = {
            backgroundColor: 'transparent',
            geo: {
              map: 'china',
              roam: true,
              zoom: 1.3,
              center: [104.114129, 37.550339],
              itemStyle: {
                areaColor: '#F5E6D3',
                borderColor: '#2C2C2C',
                borderWidth: 1.5
              },
              emphasis: {
                itemStyle: { areaColor: '#E8D5B7', borderColor: '#C0392B', borderWidth: 2 },
                label: { show: true, fontSize: 14, fontWeight: '600', color: '#C0392B' }
              },
              label: { show: true, fontSize: 11, color: '#2C2C2C', fontFamily: "'Ma Shan Zheng', cursive" },
              regions
            },
            tooltip: {
              trigger: 'item',
              backgroundColor: 'rgba(255, 255, 255, 0.98)',
              borderColor: '#D4C4A8',
              borderWidth: 1,
              borderRadius: 8,
              padding: 14,
              textStyle: { color: '#2C2C2C', fontFamily: "'Noto Serif SC', serif" },
              formatter: (params) => {
                if (params.seriesType === 'scatter' && params.value && params.value[2]) {
                  const s = params.value[2];
                  const hobbiesHtml = s.hobbies && s.hobbies.length
                    ? `<div style="font-size:12px;color:#999;margin-top:6px;">🎯 ${s.hobbies.join('、')}</div>`
                    : '';
                  const foodBadge = s.looking_for_food
                    ? `<span style="display:inline-block;padding:2px 8px;background:#D5F5E3;color:#1E8449;border-radius:10px;font-size:11px;margin-left:8px;">🍜 找饭搭子</span>`
                    : '';
                  return `
                    <div style="min-width:240px;">
                      <div style="font-size:18px;font-weight:600;margin-bottom:8px;color:#C0392B;">
                        � ${s.nickname}
                        ${foodBadge}
                      </div>
                      <div style="border-top:1px solid #eee;padding-top:10px;font-size:13px;line-height:1.9;">
                        <div>📍 ${s.province} · ${s.city}</div>
                        <div>🏫 ${s.university}</div>
                        ${s.major ? `<div>📚 ${s.major}</div>` : ''}
                        ${hobbiesHtml}
                      </div>
                    </div>
                  `;
                }
                return `<div style="font-weight:500;font-size:14px;">${params.name}</div>`;
              }
            },
            series: [{
              type: 'scatter',
              coordinateSystem: 'geo',
              data: buildScatterData(),
              symbol: 'circle',
              symbolSize: 14,
              emphasis: {
                scale: true,
                scaleSize: 1.8,
                itemStyle: {
                  shadowBlur: 20,
                  shadowColor: 'rgba(192, 57, 43, 0.6)'
                },
                label: { show: true }
              },
              label: {
                show: false,
                position: 'right',
                formatter: (params) => params.value[2].nickname,
                fontSize: 12,
                fontWeight: '500',
                color: '#2C2C2C',
                backgroundColor: 'rgba(255,255,255,0.9)',
                padding: [2, 6],
                borderRadius: 4,
                borderColor: '#D4C4A8',
                borderWidth: 1
              },
              animation: true,
              animationDuration: 800,
              animationEasing: 'cubicOut',
              zlevel: 2
            }]
          };
          return option;
        };

        const initMap = async () => {
          try {
            await nextTick();
            if (!mapRef.value) return;
            if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
            echarts.registerMap('china', CHINA_GEOJSON);
            chartInstance = echarts.init(mapRef.value);
            chartInstance.setOption(buildChartOption());
            setTimeout(() => chartInstance && chartInstance.resize(), 100);
            window.addEventListener('resize', handleResize);
          } catch (e) {
            console.error('地图初始化失败:', e);
          } finally {
            mapLoading.value = false;
          }
        };

        const handleResize = () => { if (chartInstance) chartInstance.resize(); };

        const updateMap = () => {
          if (!chartInstance) return;
          chartInstance.setOption({ series: [{ data: buildScatterData() }] });
        };

        const highlightStudent = (student) => {
          const center = PROVINCE_DATA[student.province]?.center;
          if (chartInstance && center) {
            chartInstance.dispatchAction({ type: 'showTip', seriesIndex: 0, name: student.nickname });
            chartInstance.dispatchAction({ type: 'highlight', seriesIndex: 0, name: student.nickname });
            chartInstance.setOption({ geo: { center, zoom: 2 } });
            setTimeout(() => {
              chartInstance.dispatchAction({ type: 'downplay', seriesIndex: 0 });
            }, 3000);
          }
        };

        watch(() => studentsStore.list.length, () => { updateMap(); }, { deep: true });

        const doLogin = async () => {
          const ok = await DataProvider.adminLogin(password.value);
          if (ok) {
            showLogin.value = false;
            password.value = '';
            emit('navigate', 'admin');
          } else {
            pwdError.value = true;
            pwdShake.value = true;
            password.value = '';
            setTimeout(() => pwdShake.value = false, 500);
            if (pwdInput.value) pwdInput.value.focus();
          }
        };

        const submitApply = async () => {
          if (!applyForm.nickname.trim() || !applyForm.province || !applyForm.city.trim() || !applyForm.university.trim()) {
            alert('请填写所有带 * 的必填项！');
            return;
          }
          const hobbies = applyForm.hobbiesText
            ? applyForm.hobbiesText.split(/[,，、]/).map(h => h.trim()).filter(Boolean)
            : [];
          await DataProvider.addPending({
            nickname: applyForm.nickname.trim(),
            province: applyForm.province,
            city: applyForm.city.trim(),
            university: applyForm.university.trim(),
            major: applyForm.major.trim(),
            hobbies,
            wechat: applyForm.wechat.trim(),
            qq: applyForm.qq.trim(),
            looking_for_food: applyForm.looking_for_food
          });
          alert('✅ 申请已提交！请等待管理员审核通过。');
          showApply.value = false;
          Object.assign(applyForm, { nickname: '', province: '', city: '', university: '', major: '', hobbiesText: '', wechat: '', qq: '', looking_for_food: false });
        };

        const newMessage = ref('');
        const messageListRef = ref(null);
        const isAdmin = computed(() => DataProvider.isAdmin());
        const messages = computed(() => [...messagesStore.list].reverse());

        const sendMessage = async () => {
          const content = newMessage.value.trim();
          if (!content) return;
          await DataProvider.addMessage(content);
          newMessage.value = '';
          nextTick(() => {
            if (messageListRef.value) {
              messageListRef.value.scrollTop = 0;
            }
          });
        };

        const deleteMessage = async (msg) => {
          if (!confirm('确定删除这条留言吗？')) return;
          await DataProvider.deleteMessage(msg.id);
        };

        watch(showLogin, (val) => {
          if (val) nextTick(() => pwdInput.value && pwdInput.value.focus());
        });

        onMounted(() => { setTimeout(() => initMap(), 100); });
        onUnmounted(() => {
          window.removeEventListener('resize', handleResize);
          if (chartInstance) { chartInstance.dispose(); chartInstance = null; }
        });

        return {
          mapRef, mapLoading,
          keyword, showLogin, showApply, password, pwdError, pwdShake, pwdInput,
          applyForm,
          PROVINCE_LIST,
          studentsStore,
          filteredStudents, groupedByProvince,
          totalCount, provinceCount, universityCount, foodCount,
          highlightStudent, doLogin, submitApply,
          newMessage, messageListRef, isAdmin, messages,
          sendMessage, deleteMessage
        };
      }
    };

    // ========== 管理员页面 ==========
    const AdminPage = {
      template: `
        <div class="admin-page">
          <div class="admin-header">
            <div class="admin-title calligraphy">🔧 档案管理系统</div>
            <div class="top-actions">
              <button class="btn btn-secondary" @click="goMain">← 返回地图</button>
              <button class="btn btn-secondary" @click="logout">退出登录</button>
            </div>
          </div>

          <div class="admin-content">
            <div class="admin-tabs">
              <div
                v-for="tab in tabs"
                :key="tab.key"
                class="admin-tab"
                :class="{ active: activeTab === tab.key }"
                @click="activeTab = tab.key"
              >
                {{ tab.label }}
                <span v-if="tab.key === 'pending' && pendingCount > 0" class="tab-badge">{{ pendingCount }}</span>
              </div>
            </div>

            <div class="add-btn-wrap">
              <button v-if="activeTab !== 'pending'" class="btn btn-primary" @click="openAddModal">➕ 添加同学档案</button>
            </div>

            <div class="student-table">
              <div class="table-header">
                <div class="col-name">姓名</div>
                <div class="col-province">省份/城市</div>
                <div class="col-school">大学</div>
                <div class="col-major">专业</div>
                <div class="col-status">饭搭子</div>
                <div class="col-actions">操作</div>
              </div>
              <div v-if="filteredList.length === 0" style="padding:60px;text-align:center;color:#999;">
                <div style="font-size:48px;margin-bottom:12px;">{{ activeTab === 'pending' ? '📬' : '📋' }}</div>
                <div>{{ activeTab === 'pending' ? '暂无待审核申请' : '暂无档案数据，点击上方按钮添加' }}</div>
              </div>
              <div
                v-for="(item, idx) in filteredList"
                :key="item.id"
                class="table-row fade-in-up"
                :style="{ animationDelay: idx * 0.03 + 's' }"
              >
                <div class="col-name">
                  <strong>{{ item.nickname }}</strong>
                </div>
                <div class="col-province">{{ item.province }} · {{ item.city }}</div>
                <div class="col-school">{{ item.university }}</div>
                <div class="col-major">{{ item.major || '—' }}</div>
                <div class="col-status">
                  <span v-if="item.looking_for_food" class="status-badge status-approved">🍜 找饭搭子</span>
                  <span v-else style="color:#999;font-size:12px;">—</span>
                </div>
                <div class="col-actions">
                  <template v-if="activeTab === 'pending'">
                    <button class="btn btn-sm btn-primary" @click="approveApplication(item)">通过</button>
                    <button class="btn btn-sm btn-danger" @click="rejectApplication(item)">拒绝</button>
                  </template>
                  <template v-else>
                    <button class="btn btn-sm btn-secondary" @click="openEditModal(item)">编辑</button>
                    <button class="btn btn-sm btn-danger" @click="deleteStudent(item)">删除</button>
                  </template>
                </div>
              </div>
            </div>
          </div>

          <!-- 添加/编辑弹窗 -->
          <transition name="modal">
            <div v-if="showModal" class="modal-mask" @click.self="closeModal">
              <div class="modal-content">
                <div class="modal-title calligraphy">
                  {{ isEdit ? '✏️ 编辑同学档案' : '➕ 添加同学档案' }}
                </div>
                <div class="form-group">
                  <label>姓名 <span style="color:var(--cinnabar)">*</span></label>
                  <input type="text" v-model="form.nickname" placeholder="请输入姓名">
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>省份 <span style="color:var(--cinnabar)">*</span></label>
                    <select v-model="form.province">
                      <option value="">请选择省份</option>
                      <option v-for="p in PROVINCE_LIST" :key="p" :value="p">{{ p }}</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>城市 <span style="color:var(--cinnabar)">*</span></label>
                    <input type="text" v-model="form.city" placeholder="如：北京市">
                  </div>
                </div>
                <div class="form-group">
                  <label>大学 <span style="color:var(--cinnabar)">*</span></label>
                  <input type="text" v-model="form.university" placeholder="请输入大学名称">
                </div>
                <div class="form-group">
                  <label>专业</label>
                  <input type="text" v-model="form.major" placeholder="请输入专业（选填）">
                </div>
                <div class="form-group">
                  <label>兴趣爱好（逗号分隔）</label>
                  <input type="text" v-model="form.hobbiesText" placeholder="如：篮球,美食,旅行">
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>微信号</label>
                    <input type="text" v-model="form.wechat" placeholder="选填">
                  </div>
                  <div class="form-group">
                    <label>QQ号</label>
                    <input type="text" v-model="form.qq" placeholder="选填">
                  </div>
                </div>
                <div class="form-group">
                  <label>
                    <input type="checkbox" v-model="form.looking_for_food" style="margin-right:6px;accent-color:var(--cinnabar);">
                    🍜 正在寻找饭搭子
                  </label>
                </div>
                <div class="form-actions">
                  <button class="btn btn-secondary" @click="closeModal">取消</button>
                  <button class="btn btn-primary" @click="saveStudent">保存</button>
                </div>
              </div>
            </div>
          </transition>
        </div>
      `,
      setup(props, { emit }) {
        const tabs = [
          { key: 'pending', label: '待审核' },
          { key: 'all', label: '全部档案' },
          { key: 'food', label: '找饭搭子' }
        ];
        const activeTab = ref('pending');
        const showModal = ref(false);
        const isEdit = ref(false);
        const editId = ref(null);

        const form = reactive({
          nickname: '', province: '', city: '', university: '',
          major: '', hobbiesText: '', wechat: '', qq: '', looking_for_food: false
        });

        const filteredList = computed(() => {
          if (activeTab.value === 'food') {
            return studentsStore.list.filter(s => s.looking_for_food);
          }
          if (activeTab.value === 'pending') {
            return pendingApplications.list;
          }
          return studentsStore.list;
        });

        const pendingCount = computed(() => pendingApplications.list.length);

        const resetForm = () => {
          Object.assign(form, {
            nickname: '', province: '', city: '', university: '',
            major: '', hobbiesText: '', wechat: '', qq: '', looking_for_food: false
          });
          isEdit.value = false;
          editId.value = null;
        };

        const openAddModal = () => { resetForm(); showModal.value = true; };

        const openEditModal = (item) => {
          isEdit.value = true;
          editId.value = item.id;
          Object.assign(form, {
            nickname: item.nickname,
            province: item.province,
            city: item.city,
            university: item.university,
            major: item.major || '',
            hobbiesText: (item.hobbies || []).join(', '),
            wechat: item.wechat || '',
            qq: item.qq || '',
            looking_for_food: item.looking_for_food
          });
          showModal.value = true;
        };

        const closeModal = () => { showModal.value = false; resetForm(); };

        const saveStudent = async () => {
          if (!form.nickname.trim() || !form.province || !form.city.trim() || !form.university.trim()) {
            alert('请填写所有带 * 的必填项！');
            return;
          }
          const center = PROVINCE_DATA[form.province]?.center || [105, 35];
          const hobbies = form.hobbiesText
            ? form.hobbiesText.split(/[,，、]/).map(h => h.trim()).filter(Boolean)
            : [];

          const studentData = {
            nickname: form.nickname.trim(),
            province: form.province,
            city: form.city.trim(),
            university: form.university.trim(),
            major: form.major.trim(),
            hobbies,
            wechat: form.wechat || '',
            qq: form.qq || '',
            looking_for_food: form.looking_for_food,
            longitude: center[0] + (Math.random() - 0.5) * 0.4,
            latitude: center[1] + (Math.random() - 0.5) * 0.4
          };

          if (isEdit.value) {
            await DataProvider.updateStudent(editId.value, studentData);
            alert('✅ 档案已更新');
          } else {
            await DataProvider.addStudent(studentData);
            alert('✅ 档案已添加');
          }
          closeModal();
        };

        const deleteStudent = async (item) => {
          if (!confirm(`确定要删除「${item.nickname}」的档案吗？`)) return;
          await DataProvider.deleteStudent(item.id);
          alert('已删除');
        };

        const approveApplication = async (item) => {
          if (!confirm(`确定要通过「${item.nickname}」的申请吗？`)) return;
          const center = PROVINCE_DATA[item.province]?.center || [105, 35];
          await DataProvider.addStudent({
            nickname: item.nickname,
            province: item.province,
            city: item.city,
            university: item.university,
            major: item.major || '',
            hobbies: item.hobbies || [],
            wechat: item.wechat || '',
            qq: item.qq || '',
            looking_for_food: item.looking_for_food,
            longitude: center[0] + (Math.random() - 0.5) * 0.4,
            latitude: center[1] + (Math.random() - 0.5) * 0.4
          });
          await DataProvider.removePending(item.id);
          alert('✅ 已通过申请');
        };

        const rejectApplication = async (item) => {
          if (!confirm(`确定要拒绝「${item.nickname}」的申请吗？`)) return;
          await DataProvider.removePending(item.id);
          alert('已拒绝申请');
        };

        const logout = () => {
          DataProvider.adminLogout();
          emit('navigate', 'home');
        };
        const goMain = () => emit('navigate', 'home');

        onMounted(() => {
          DataProvider.getPending();
        });

        return {
          tabs, activeTab, showModal, isEdit, form,
          PROVINCE_LIST, filteredList, pendingCount,
          openAddModal, openEditModal, closeModal, saveStudent, deleteStudent,
          approveApplication, rejectApplication,
          logout, goMain
        };
      }
    };

    // ========== 根应用 ==========
    createApp({
      setup() {
        const currentPage = ref('entry');

        const currentPageComponent = computed(() => {
          const isAuthed = DataProvider.isAdmin();
          if (currentPage.value === 'admin' && !isAuthed) return EntryPage;
          const map = { entry: EntryPage, home: MainPage, admin: AdminPage };
          return map[currentPage.value] || EntryPage;
        });

        const navigateTo = (page) => {
          currentPage.value = page;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        return { currentPage, currentPageComponent, navigateTo };
      }
    }).mount('#app');
  </script>
</body>
</html>
